<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journey — Dinesh Ravichandiran</title>
<meta name="description" content="An interactive 3D ride through Dinesh's career journey from DRDO to NOC Specialist at PTC.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e3a8a'/%3E%3Ctext x='50' y='68' font-family='serif' font-size='52' font-weight='600' text-anchor='middle' fill='%23ffffff'%3EDR%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
–bg: #ffffff;
–text: #0a0a0a;
–text-secondary: #1f1f1f;
–text-muted: #404040;
–border: #e5e7eb;
–accent: #1e3a8a;
–accent-hover: #1e40af;
–accent-light: #eff6ff;
}

html, body {
margin: 0;
padding: 0;
overflow: hidden;
background: linear-gradient(to bottom, #e0e7ff 0%, #f5f7fb 60%, #ffffff 100%);
color: var(–text);
font-family: ‘Manrope’, -apple-system, BlinkMacSystemFont, sans-serif;
width: 100vw;
height: 100vh;
-webkit-font-smoothing: antialiased;
}

#canvas {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
display: block;
z-index: 0;
}

/* ===== BACK LINK ===== */
.back-link {
position: fixed;
top: 1.5rem;
left: 1.5rem;
z-index: 10;
padding: 0.6rem 1.1rem;
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(8px);
border: 1px solid var(–border);
border-radius: 6px;
color: var(–text);
text-decoration: none;
font-size: 0.85rem;
font-weight: 600;
display: inline-flex;
align-items: center;
gap: 0.5rem;
transition: all 0.2s;
}

.back-link:hover {
border-color: var(–accent);
color: var(–accent);
}

/* ===== HUD HEADER — hidden since milestones moved to top ===== */
.hud { display: none; }

/* ===== MILESTONE SELECTOR — TOP BAR ===== */
.milestones {
position: fixed;
top: 1.5rem;
left: 50%;
transform: translateX(-50%);
z-index: 10;
display: flex;
flex-direction: row;
gap: 0.4rem;
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(12px);
border: 1px solid var(–border);
border-radius: 100px;
padding: 0.5rem;
box-shadow: 0 10px 40px -10px rgba(30, 58, 138, 0.2);
max-width: calc(100vw - 200px);
overflow-x: auto;
scrollbar-width: none;
}

.milestones::-webkit-scrollbar { display: none; }

.milestones .ms-label { display: none; }

.milestone-btn {
background: transparent;
border: 1px solid transparent;
border-radius: 100px;
padding: 0.55rem 1.1rem;
text-align: center;
cursor: pointer;
font-family: ‘Manrope’, sans-serif;
transition: all 0.2s;
color: var(–text);
white-space: nowrap;
flex-shrink: 0;
user-select: none;
}

.milestone-btn:hover {
background: var(–accent-light);
color: var(–accent);
}

.milestone-btn:active {
transform: scale(0.96);
}

.milestone-btn.active {
background: var(–accent);
color: #ffffff;
box-shadow: 0 4px 14px rgba(30, 58, 138, 0.35);
}

.milestone-btn .ms-year {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.62rem;
font-weight: 600;
color: var(–accent);
display: block;
letter-spacing: 0.05em;
}

.milestone-btn.active .ms-year {
color: rgba(255, 255, 255, 0.85);
}

.milestone-btn .ms-name {
font-size: 0.85rem;
font-weight: 700;
display: block;
margin-top: 0.1rem;
}

.milestone-btn .ms-role { display: none; }

/* ===== INFO PANEL ===== */
.info-panel {
position: fixed;
bottom: 1.5rem;
left: 50%;
transform: translateX(-50%) translateY(120%);
z-index: 10;
width: min(720px, calc(100vw - 4rem));
max-height: 60vh;
overflow-y: auto;
background: rgba(255, 255, 255, 0.99);
backdrop-filter: blur(16px);
border: 1px solid var(–border);
border-left: 5px solid var(–accent);
border-radius: 12px;
padding: 1.75rem 2rem;
box-shadow: 0 24px 60px -16px rgba(30, 58, 138, 0.3);
opacity: 0;
transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
}

.info-panel.visible {
transform: translateX(-50%) translateY(0);
opacity: 1;
}

.info-panel .info-meta {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.78rem;
color: var(–accent);
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.12em;
margin-bottom: 0.6rem;
}

.info-panel h2 {
font-size: 1.75rem;
font-weight: 800;
color: #0a0a0a;
letter-spacing: -0.02em;
margin-bottom: 0.4rem;
line-height: 1.15;
}

.info-panel .info-role {
font-size: 1.05rem;
color: var(–accent);
font-weight: 600;
margin-bottom: 1rem;
}

.info-panel .info-body {
font-size: 1rem;
color: #1f1f1f;
line-height: 1.7;
margin-bottom: 1.2rem;
font-weight: 400;
}

.info-panel .info-tags {
display: flex;
flex-wrap: wrap;
gap: 0.5rem;
}

.info-panel .info-tag {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.78rem;
color: var(–accent);
background: var(–accent-light);
padding: 0.4rem 0.85rem;
border-radius: 6px;
font-weight: 600;
border: 1px solid rgba(30, 58, 138, 0.15);
}

/* ===== HINT ===== */
.hint {
position: fixed;
bottom: 1.5rem;
left: 1.5rem;
z-index: 10;
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.7rem;
color: var(–text-muted);
background: rgba(255, 255, 255, 0.9);
padding: 0.5rem 0.85rem;
border-radius: 6px;
border: 1px solid var(–border);
letter-spacing: 0.05em;
}

/* ===== LOADER ===== */
.loader {
position: fixed;
inset: 0;
background: #ffffff;
z-index: 100;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
gap: 1.5rem;
transition: opacity 0.5s;
}

.loader.hidden {
opacity: 0;
pointer-events: none;
}

.loader-text {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.85rem;
color: var(–accent);
font-weight: 600;
letter-spacing: 0.15em;
text-transform: uppercase;
}

.loader-bar {
width: 200px;
height: 2px;
background: var(–border);
border-radius: 2px;
overflow: hidden;
}

.loader-bar::before {
content: ‘’;
display: block;
width: 40%;
height: 100%;
background: var(–accent);
animation: loaderSlide 1.2s ease-in-out infinite;
}

@keyframes loaderSlide {
0% { transform: translateX(-100%); }
100% { transform: translateX(350%); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
.milestones {
top: 4rem;
max-width: calc(100vw - 1.5rem);
padding: 0.35rem;
}
.milestone-btn { padding: 0.45rem 0.8rem; }
.milestone-btn .ms-name { font-size: 0.75rem; }
.milestone-btn .ms-year { font-size: 0.55rem; }
.info-panel {
width: calc(100vw - 1.5rem);
left: 0.75rem;
right: 0.75rem;
transform: translateY(120%);
padding: 1.2rem;
}
.info-panel.visible { transform: translateY(0); }
.hint { display: none; }
.back-link { font-size: 0.75rem; padding: 0.5rem 0.85rem; }
}
</style>

</head>

">◉ 360° View</button>

<script>

if (typeof THREE === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');

<script>
// ====================================================
// THREE.JS LOAD CHECK
// ====================================================
if (typeof THREE === 'undefined') {
  document.getElementById('loader').innerHTML = `
    <div style="text-align: center; padding: 2rem; max-width: 400px;">
      <div style="font-size: 1.2rem; font-weight: 700; color: #1e3a8a; margin-bottom: 1rem;">3D Engine Failed to Load</div>
      <div style="font-size: 0.9rem; color: #404040; line-height: 1.6; margin-bottom: 1.5rem;">
        Three.js could not be loaded from the CDN. This may be due to a network restriction or ad-blocker.
      </div>
      <a href="index.html" style="display: inline-block; padding: 0.7rem 1.4rem; background: #1e3a8a; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">← Back to Portfolio</a>
    </div>
  `;
  throw new Error('Three.js not loaded');
}

// ====================================================
// CAREER DATA
// ====================================================
const MILESTONES = [
  {
    year: '2021',
    city: 'CHENNAI',
    name: 'DRDO',
    role: 'R&D Engineering Intern',
    meta: '01 · CHENNAI · Aug 2021',
    body: "Contributed to a defence R&D project at DRDO Avadi involving sensor integration for combat vehicle systems. Worked in a small team under DRDO supervision. The discipline of working on real-world, mission-critical hardware shaped my approach to reliability and documentation.",
    tags: ['Defence R&D', 'Sensor Integration', 'Hardware', 'Avadi, Chennai']
  },
  {
    year: 'Jan – Jun 2022',
    city: 'BANGALORE',
    name: 'Cognizant',
    role: 'Programmer Analyst Trainee',
    meta: '02 · BANGALORE · First Software Role',
    body: "Developed a CRUD-based Life Insurance Management application using Java, Spring Boot, and MySQL. Built REST APIs and documented setup procedures. First exposure to enterprise software development practices, version control, and team workflows.",
    tags: ['Java', 'Spring Boot', 'REST APIs', 'Bangalore']
  },
  {
    year: 'Jul – Nov 2022',
    city: 'PUNE',
    name: 'Johnson Controls',
    role: 'BMS Intern',
    meta: '03 · PUNE · Smart Buildings',
    body: "Supported documentation for Building Management Systems solutions in smart building automation and energy management. Introduced me to enterprise-scale systems that real businesses depend on 24/7 — a preview of what was to come.",
    tags: ['BMS', 'Smart Buildings', 'Pune']
  },
  {
    year: 'Dec 2022 – Nov 2025',
    city: 'PUNE',
    name: 'PTC',
    role: 'NOC Engineer – Associate',
    meta: '04 · PUNE · The Foundation · 3 Years',
    body: "Production operations for Windchill, Windchill+, FlexPLM, and ThingWorx on Azure and AWS. Resolved 5,000+ incidents, maintained 99.9% uptime, reduced MTTR by ~30%. Authored team-wide runbooks, drove memory alert tuning, and was recognized with PTC's Customer First Award.",
    tags: ['5,000+ Incidents', '99.9% Uptime', '~30% MTTR ↓', 'Customer First Award', 'Azure & AWS']
  },
  {
    year: 'Dec 2025 – Present',
    city: 'PUNE',
    name: 'PTC',
    role: 'NOC Engineer – Specialist',
    meta: '05 · PUNE · Now · Specialist Track',
    body: "Driving incident response, root-cause analysis, and reliability initiatives for enterprise PLM and IIoT platforms. Lead outage coordination across App, DB, and Network teams. Mentor newer engineers and own runbook quality for the rotation. Targeting SRE roles at product-first companies.",
    tags: ['24×7 On-Call', 'Sev0–Sev3', 'Mentoring', 'RCA Lead', 'SRE Track']
  }
];

// ====================================================
// SETUP MILESTONE BUTTONS
// ====================================================
const msList = document.getElementById('milestoneList');
MILESTONES.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.className = 'milestone-btn';
  btn.dataset.index = i;
  btn.type = 'button';
  btn.setAttribute('aria-label', `Ride to ${m.name}, ${m.year}`);
  btn.innerHTML = `
    <span class="ms-year">${m.year}</span>
    <span class="ms-name">${m.name}</span>
    <span class="ms-role">${m.role}</span>
  `;
  const onSelect = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    console.log('[Journey] Riding to milestone', i, m.name);
    rideTo(i);
  };
  btn.addEventListener('click', onSelect);
  btn.addEventListener('touchend', onSelect, { passive: false });
  msList.appendChild(btn);
});

// ====================================================
// THREE.JS SETUP
// ====================================================
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf5f7fb, 30, 90);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ====================================================
// LIGHTING
// ====================================================
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0xeff6ff, 0.3);
fillLight.position.set(-15, 10, -10);
scene.add(fillLight);

// ====================================================
// GROUND
// ====================================================
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshLambertMaterial({ color: 0xe8eef5 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// Zone-tinted ground patches (only on either side of the road, not on road itself)
function addZonePatch(xCenter, xWidth, color, opacity) {
  const patchGeo = new THREE.PlaneGeometry(xWidth, 80);
  const patchMat = new THREE.MeshLambertMaterial({ color, transparent: true, opacity });
  // Left strip
  const patchL = new THREE.Mesh(patchGeo, patchMat);
  patchL.rotation.x = -Math.PI / 2;
  patchL.position.set(xCenter, 0, -42);
  scene.add(patchL);
  // Right strip
  const patchR = new THREE.Mesh(patchGeo, patchMat);
  patchR.rotation.x = -Math.PI / 2;
  patchR.position.set(xCenter, 0, 42);
  scene.add(patchR);
}

// Chennai zone — sandy coastal beige
addZonePatch(7, 20, 0xeed9a8, 0.5);
// Bangalore zone — garden city green
addZonePatch(25, 20, 0xc4d8b8, 0.5);
// Pune zone — Deccan plateau tan
addZonePatch(48, 25, 0xd9c7a0, 0.5);

// Grid (subtle)
const grid = new THREE.GridHelper(200, 80, 0xd4dde8, 0xe6ebf3);
grid.position.y = 0;
scene.add(grid);

// ====================================================
// ROAD PATH (Curve)
// ====================================================
const pathPoints = [
  new THREE.Vector3(0, 0, 0),       // Start
  new THREE.Vector3(10, 0, -2),     // Milestone 0: DRDO — Chennai (gentle left curve)
  new THREE.Vector3(20, 0, 1.5),    // Milestone 1: Cognizant — Bangalore (back right)
  new THREE.Vector3(30, 0, -1.5),   // Milestone 2: Johnson Controls — entering Pune
  new THREE.Vector3(40, 0, 2),      // Milestone 3: PTC Associate — Pune
  new THREE.Vector3(50, 0, -1),     // Milestone 4: PTC Specialist — Pune
  new THREE.Vector3(60, 0, 0)       // End buffer
];

// Gentle highway curves (tension 0.3 = smooth banks, not sharp turns)
const curve = new THREE.CatmullRomCurve3(pathPoints, false, 'catmullrom', 0.3);

// Build a flat road geometry along the curve
const ROAD_WIDTH = 2.2;
const roadSegments = 200;
const roadShape = [];
const roadIndices = [];
const upVec = new THREE.Vector3(0, 1, 0);

for (let i = 0; i <= roadSegments; i++) {
  const t = i / roadSegments;
  const point = curve.getPointAt(t);
  const tangent = curve.getTangentAt(t).normalize();
  const side = new THREE.Vector3().crossVectors(tangent, upVec).normalize();

  const left = point.clone().addScaledVector(side, ROAD_WIDTH / 2);
  const right = point.clone().addScaledVector(side, -ROAD_WIDTH / 2);
  roadShape.push(left.x, 0.01, left.z);
  roadShape.push(right.x, 0.01, right.z);

  if (i < roadSegments) {
    const a = i * 2;
    const b = i * 2 + 1;
    const c = (i + 1) * 2;
    const d = (i + 1) * 2 + 1;
    roadIndices.push(a, c, b, b, c, d);
  }
}

const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadShape, 3));
roadGeo.setIndex(roadIndices);
roadGeo.computeVertexNormals();
const roadMat = new THREE.MeshLambertMaterial({ color: 0x334155, side: THREE.DoubleSide });
const road = new THREE.Mesh(roadGeo, roadMat);
road.receiveShadow = true;
scene.add(road);

// Center stripe (dashed)
const stripePoints = [];
for (let i = 0; i <= roadSegments; i += 4) {
  const t = i / roadSegments;
  stripePoints.push(curve.getPointAt(t).setY(0.02));
}
const stripeGeo = new THREE.BufferGeometry().setFromPoints(stripePoints);
const stripeMat = new THREE.LineDashedMaterial({
  color: 0xfacc15,
  dashSize: 0.4,
  gapSize: 0.3,
  linewidth: 2
});
const stripe = new THREE.Line(stripeGeo, stripeMat);
stripe.computeLineDistances();
scene.add(stripe);

// ====================================================
// MILESTONE POSTS (one for each career stop)
// ====================================================
// Map each milestone to a t-value along the curve
const milestoneT = [0.10, 0.28, 0.47, 0.66, 0.86];
const milestoneObjects = [];

function buildMilestone(t, index, data) {
  const pos = curve.getPointAt(t);
  const tangent = curve.getTangentAt(t).normalize();
  const side = new THREE.Vector3().crossVectors(tangent, upVec).normalize();
  const offset = side.clone().multiplyScalar(2.2);

  const group = new THREE.Group();
  group.position.copy(pos.clone().add(offset));

  // Post (taller, more prominent)
  const postGeo = new THREE.CylinderGeometry(0.08, 0.1, 2.4, 8);
  const postMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
  const post = new THREE.Mesh(postGeo, postMat);
  post.position.y = 1.2;
  post.castShadow = true;
  group.add(post);

  // Post base (decorative)
  const baseGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.15, 12);
  const base = new THREE.Mesh(baseGeo, postMat);
  base.position.y = 0.08;
  base.castShadow = true;
  group.add(base);

  // Sign board — CURVED billboard with text always readable
  const tex = makeCompanySignTexture(data.name, data.year, index + 1);

  // Use BufferGeometry to build a curved (convex) plane manually so text orientation is GUARANTEED
  const SIGN_WIDTH = 2.6;
  const SIGN_HEIGHT = 1.2;
  const SIGN_CURVE_DEPTH = 0.25;
  const SEGMENTS = 16;

  function buildCurvedSign(material, width, height, depth) {
    const geo = new THREE.BufferGeometry();
    const positions = [];
    const uvs = [];
    const indices = [];

    // Build a grid of vertices curved along the X axis
    for (let i = 0; i <= SEGMENTS; i++) {
      const u = i / SEGMENTS;
      const x = (u - 0.5) * width;
      // Parabolic curve depth: zero at edges, max at center
      const z = -depth * (1 - Math.pow(2 * u - 1, 2));
      // Two rows of vertices: top and bottom
      positions.push(x, height / 2, z);
      positions.push(x, -height / 2, z);
      uvs.push(u, 1);
      uvs.push(u, 0);
    }
    // Triangulate
    for (let i = 0; i < SEGMENTS; i++) {
      const a = i * 2;
      const b = i * 2 + 1;
      const c = (i + 1) * 2;
      const d = (i + 1) * 2 + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }

    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, material);
  }

  // FRONT face (texture, double-sided so it shows from the back too)
  const signFront = buildCurvedSign(
    new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide }),
    SIGN_WIDTH, SIGN_HEIGHT, SIGN_CURVE_DEPTH
  );
  signFront.position.y = 2.6;
  signFront.castShadow = true;
  group.add(signFront);

  // Navy frame BEHIND the sign (slightly larger)
  const signFrame = buildCurvedSign(
    new THREE.MeshLambertMaterial({ color: 0x1e3a8a, side: THREE.DoubleSide }),
    SIGN_WIDTH + 0.15, SIGN_HEIGHT + 0.18, SIGN_CURVE_DEPTH + 0.04
  );
  signFrame.position.y = 2.6;
  signFrame.position.z = 0.02;
  group.add(signFrame);

  // Two support struts (visible from behind)
  for (let side of [-1, 1]) {
    const strut = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.035, 0.55, 6),
      new THREE.MeshLambertMaterial({ color: 0x1e3a8a })
    );
    strut.position.set(0, 2.6 + side * 0.4, 0.1);
    strut.rotation.x = side * Math.PI / 8;
    group.add(strut);
  }

  // Make whole sign face the road: the CONVEX side (-Z direction) points outward
  // group.lookAt() points the local -Z axis at the target, which is exactly what we want
  group.lookAt(pos.x, group.position.y, pos.z);

  // Glow ring at base (pulses when active)
  const ringGeo = new THREE.RingGeometry(0.8, 1.1, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x1e3a8a,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  ring.position.copy(pos);
  ring.position.y = 0.02;
  scene.add(ring);

  scene.add(group);
  milestoneObjects.push({ group, ring, pos });
}

function makeCompanySignTexture(name, year, num) {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 448;
  const ctx = c.getContext('2d');

  // White background with subtle gradient
  const grad = ctx.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#f8fafc');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, c.width, c.height);

  // Inner navy border
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 6;
  ctx.strokeRect(20, 20, c.width - 40, c.height - 40);

  // Step number badge (top-left circle)
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  ctx.arc(85, 85, 45, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 56px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num.toString(), 85, 88);

  // Company name (main) — auto-shrink to fit, measured by actual pixel width
  ctx.fillStyle = '#0a0a0a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxNameWidth = c.width - 200; // leave padding on both sides
  let nameFontSize = 100;
  ctx.font = `bold ${nameFontSize}px Manrope, sans-serif`;
  while (ctx.measureText(name).width > maxNameWidth && nameFontSize > 40) {
    nameFontSize -= 4;
    ctx.font = `bold ${nameFontSize}px Manrope, sans-serif`;
  }
  ctx.fillText(name, c.width / 2, c.height / 2 - 10);

  // Year (subtitle) — also auto-shrink for long date ranges
  ctx.fillStyle = '#1e3a8a';
  const maxYearWidth = c.width - 160;
  let yearFontSize = 44;
  ctx.font = `600 ${yearFontSize}px JetBrains Mono, monospace`;
  while (ctx.measureText(year).width > maxYearWidth && yearFontSize > 22) {
    yearFontSize -= 2;
    ctx.font = `600 ${yearFontSize}px JetBrains Mono, monospace`;
  }
  ctx.fillText(year, c.width / 2, c.height / 2 + 80);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 4;
  return tex;
}

// ====================================================
// CITY ZONES — Chennai → Bangalore → Pune
// Each zone has its own landmark style scattered along the highway
// ====================================================

// X-range for each city zone along the straight highway
// Total road runs from x=0 to x=60
// Chennai: 0–15, Bangalore: 15–35, Pune: 35–60
const ZONES = {
  CHENNAI:   { xStart: -5,  xEnd: 15,  color: 0x86b8e8 }, // coastal blue tint
  BANGALORE: { xStart: 15,  xEnd: 35,  color: 0x7fb88a }, // garden city green
  PUNE:      { xStart: 35,  xEnd: 65,  color: 0xb5a780 }  // dry tan/hill tone
};

// X-positions along the road where milestone signs are placed (offset to the right side around z=+2.2)
// Trees/buildings must stay away from these
const MILESTONE_EXCLUSION_X = [6, 17, 28, 40, 52]; // approximate x-coords
const MILESTONE_EXCLUSION_RADIUS = 5;

// Helper: random position in a zone, away from the road AND away from milestone signs
function randomInZone(zone, minDist = 4, maxDist = 16) {
  for (let tries = 0; tries < 30; tries++) {
    const x = zone.xStart + Math.random() * (zone.xEnd - zone.xStart);
    const side = Math.random() < 0.5 ? 1 : -1;
    const z = side * (minDist + Math.random() * (maxDist - minDist));

    // Check distance from each milestone X-position
    let tooClose = false;
    for (const mx of MILESTONE_EXCLUSION_X) {
      // Signs sit at z=+2.2, so trees on positive-z side are riskier
      const dx = x - mx;
      const dz = z - (side > 0 ? 2.2 : 0);
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < MILESTONE_EXCLUSION_RADIUS) { tooClose = true; break; }
    }
    if (!tooClose) return { x, z };
  }
  // Fallback if we can't find a free spot — push far away
  return {
    x: zone.xStart + Math.random() * (zone.xEnd - zone.xStart),
    z: (Math.random() < 0.5 ? 1 : -1) * (maxDist + 2)
  };
}

  const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  grad.addColorStop(0, '#1e3a8a');
  grad.addColorStop(1, '#2563eb');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Gold inner border (highway sign style)
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 6;
  ctx.strokeRect(18, 18, canvas.width - 36, canvas.height - 36);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(36, 36, canvas.width - 72, canvas.height - 72);

  ctx.fillStyle = '#1e3a8a';
  ctx.font = '600 60px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('WELCOME TO', canvas.width / 2, 90);

  // City name — BIG, auto-sized to fit the canvas width
  let fontSize = 150;
  ctx.font = `bold ${fontSize}px Manrope, sans-serif`;
  const maxWidth = canvas.width - 120;
  while (ctx.measureText(cityName).width > maxWidth && fontSize > 60) {
    fontSize -= 5;
    ctx.font = `bold ${fontSize}px Manrope, sans-serif`;
  }
  ctx.fillStyle = '#dc2626'; // Red for emphasis (like highway signs)
  ctx.fillText(cityName, canvas.width / 2, 195);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 4;

  // Banner — wider and taller to match the new canvas proportions
  const navyMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
  const faceMat = new THREE.MeshLambertMaterial({ map: tex });
  const banner = new THREE.Mesh(

// ---------- WHEELS (BIG, with spokes — Harley style) ----------
const WHEEL_RADIUS = 0.42;
function makeHarleyWheel() {
  const w = new THREE.Group();
  // Fat tire (torus, default orientation = standing wheel rolling forward)
  const tire = new THREE.Mesh(
    new THREE.TorusGeometry(WHEEL_RADIUS, 0.12, 12, 32),
    new THREE.MeshLambertMaterial({ color: HARLEY_TIRE })
  );
  tire.castShadow = true;
  w.add(tire);
  // Chrome rim
  const rim = new THREE.Mesh(
    new THREE.CylinderGeometry(WHEEL_RADIUS - 0.12, WHEEL_RADIUS - 0.12, 0.12, 24),
    chromeMat
  );
  rim.rotation.x = Math.PI / 2;
  w.add(rim);
  // Hub (chrome)
  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 0.16, 12),
    chromeMat
  );
  hub.rotation.x = Math.PI / 2;
  w.add(hub);
  // Spokes — 8 of them
  for (let i = 0; i < 8; i++) {
    const spoke = new THREE.Mesh(
      new THREE.BoxGeometry(0.02, WHEEL_RADIUS * 1.7, 0.02),
      chromeMat
    );
    spoke.rotation.z = (i / 8) * Math.PI;
    w.add(spoke);
  }
  return w;
}

// Custom tank decal — orange flame stripe on each side (classic chopper look)
function makeFlameTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  // Transparent background
  ctx.clearRect(0, 0, c.width, c.height);
  // Flame shape — gradient from yellow to red
  const grad = ctx.createLinearGradient(0, 0, c.width, 0);
  grad.addColorStop(0, 'rgba(251, 191, 36, 0)');
  grad.addColorStop(0.2, 'rgba(251, 191, 36, 1)');
  grad.addColorStop(0.6, 'rgba(239, 68, 68, 1)');
  grad.addColorStop(1, 'rgba(127, 29, 29, 0.7)');
  ctx.fillStyle = grad;
  // Draw stylized flame with curves
  ctx.beginPath();
  ctx.moveTo(60, 128);
  ctx.bezierCurveTo(120, 60, 200, 80, 260, 100);
  ctx.bezierCurveTo(320, 110, 380, 130, 460, 128);
  ctx.bezierCurveTo(380, 150, 320, 170, 260, 160);
  ctx.bezierCurveTo(200, 175, 120, 200, 60, 128);
  ctx.fill();
  // Inner highlight
  ctx.fillStyle = 'rgba(255, 255, 200, 0.5)';
  ctx.beginPath();
  ctx.moveTo(90, 128);
  ctx.bezierCurveTo(150, 100, 220, 110, 280, 128);
  ctx.bezierCurveTo(220, 145, 150, 155, 90, 128);
  ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

// HARLEY badge (text decal) — using canvas texture
function makeBadgeTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  // Shield background
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  ctx.moveTo(40, 20);
  ctx.lineTo(216, 20);
  ctx.lineTo(216, 80);
  ctx.lineTo(128, 110);
  ctx.lineTo(40, 80);
  ctx.closePath();
  ctx.fill();
  // Gold border
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 4;
  ctx.stroke();
  // White text
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HARLEY', 128, 50);
  ctx.font = 'bold 18px Manrope, sans-serif';
  ctx.fillStyle = '#facc15';
  ctx.fillText('★ DAVIDSON ★', 128, 78);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

// Helper: smooth capsule limb (cylinder + sphere caps on both ends)
function makeCapsule(length, radius, mat) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 16),
    mat
  );
  body.castShadow = true;
  g.add(body);
  const capTop = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), mat);
  capTop.position.y = length / 2;
  capTop.castShadow = true;
  g.add(capTop);
  const capBot = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), mat);
  capBot.position.y = -length / 2;
  capBot.castShadow = true;
  g.add(capBot);
  return g;
}

// Helper: tapered capsule (different radius at top and bottom — for limbs)
function makeTaperedCapsule(length, topR, botR, mat) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(topR, botR, length, 16),
    mat
  );
  body.castShadow = true;
  g.add(body);
  const capTop = new THREE.Mesh(new THREE.SphereGeometry(topR, 16, 12), mat);
  capTop.position.y = length / 2;
  capTop.castShadow = true;
  g.add(capTop);
  const capBot = new THREE.Mesh(new THREE.SphereGeometry(botR, 16, 12), mat);
  capBot.position.y = -length / 2;
  capBot.castShadow = true;
  g.add(capBot);
  return g;
}

// ====================================================
// CAMERA — follow bike
// ====================================================
let currentT = 0;
let targetT = 0;
const cameraOffset = new THREE.Vector3(-4, 3.2, 4.5);

// Camera modes: 'follow' (normal chase camera) or 'orbit' (360° around bike when clicked)
let cameraMode = 'follow';
let orbitAngle = 0;
let orbitSpeed = 0.006;
let orbitRadius = 3.5;
let orbitHeight = 1.8;

function updateBikePosition(delta) {
  // Ease toward target
  const lerpSpeed = 0.04;
  currentT += (targetT - currentT) * lerpSpeed;
  currentT = Math.max(0, Math.min(1, currentT));

  const pos = curve.getPointAt(currentT);
  bike.position.set(pos.x, 0, pos.z);

  // Orient bike along tangent
  const tangent = curve.getTangentAt(currentT).normalize();
  const angle = Math.atan2(tangent.x, tangent.z);
  bike.rotation.y = angle - Math.PI / 2;

  // Spin wheels around their hub axis (Z = sideways from bike, makes them roll forward)
  const movement = Math.abs(targetT - currentT) * 30;
  wheelF.rotation.z -= 0.1 + movement * 0.3;
  wheelB.rotation.z -= 0.1 + movement * 0.3;

  // ===== CAMERA: orbit mode (360° around bike) =====
  if (cameraMode === 'orbit') {
    orbitAngle += orbitSpeed;
    const camX = pos.x + Math.cos(orbitAngle) * orbitRadius;
    const camZ = pos.z + Math.sin(orbitAngle) * orbitRadius;
    const targetCamPos = new THREE.Vector3(camX, pos.y + orbitHeight, camZ);
    camera.position.lerp(targetCamPos, 0.08);
    camera.lookAt(pos.x, 1.2, pos.z);
    return;
  }

  // ===== CAMERA: normal follow mode =====
  const tangentDir = curve.getTangentAt(currentT).normalize();
  const behind = tangentDir.clone().multiplyScalar(-7);
  const sideways = new THREE.Vector3().crossVectors(tangentDir, new THREE.Vector3(0, 1, 0)).normalize();
  const parallaxX = mouse.x * 2;
  const parallaxY = -mouse.y * 1.2;
  const targetCamPos = new THREE.Vector3(
    pos.x + behind.x + sideways.x * 1.5 + parallaxX,
    pos.y + 4.5 + parallaxY,
    pos.z + behind.z + sideways.z * 1.5
  );
  camera.position.lerp(targetCamPos, 0.06);

  const lookAhead = curve.getPointAt(Math.min(currentT + 0.04, 1));
  camera.lookAt(lookAhead.x + parallaxX * 0.3, 1.5, lookAhead.z);
}

// ====================================================
// RIDE TO MILESTONE
// ====================================================
let activeMilestone = -1;

function rideTo(index) {
  targetT = milestoneT[index];
  activeMilestone = index;

  // If currently in 360° orbit view, return to follow mode so user sees the journey
  if (cameraMode === 'orbit') {
    setOrbitMode(false);
  }

  // Update button states
  document.querySelectorAll('.milestone-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  // Hide info panel during transition
  const panel = document.getElementById('infoPanel');
  panel.classList.remove('visible');

  // Pulse the destination ring
  milestoneObjects.forEach((m, i) => {
    m.ring.material.opacity = 0;
  });

  // Show info after arrival
  clearTimeout(window._arriveTimer);
  window._arriveTimer = setTimeout(() => {
    showInfo(index);
    milestoneObjects[index].ring.material.opacity = 0.6;
  }, 1400);
}

function showInfo(index) {
  const m = MILESTONES[index];
  document.getElementById('infoMeta').textContent = m.meta;
  document.getElementById('infoTitle').textContent = m.name;
  document.getElementById('infoRole').textContent = m.role;
  document.getElementById('infoBody').textContent = m.body;
  const tagsEl = document.getElementById('infoTags');
  tagsEl.innerHTML = '';
  m.tags.forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'info-tag';
    tag.textContent = t;
    tagsEl.appendChild(tag);
  });
  document.getElementById('infoPanel').classList.add('visible');
}

// ====================================================
// ANIMATE
// ====================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.elapsedTime;

  // Smooth mouse follow (used by camera parallax inside updateBikePosition)
  mouse.x += (mouse.targetX - mouse.x) * 0.05;
  mouse.y += (mouse.targetY - mouse.y) * 0.05;

  updateBikePosition(delta);

  // ===== RIDER ANIMATION =====
  // Body bob — gentle vertical sway as the rider sits on a moving scooter
  const bob = Math.sin(time * 4) * 0.015;
  riderParts.hips.position.y = riderParts.baseY.hips + bob;
  riderParts.torsoGroup.position.y = riderParts.baseY.torsoY + bob;
  riderParts.headGroup.position.y = riderParts.baseY.headY + bob * 0.6;

  // Lean into curves — the rider's body banks toward the inside of turns
  const upcoming = curve.getTangentAt(Math.min(currentT + 0.02, 1));
  const current = curve.getTangentAt(currentT);
  const turn = current.x * upcoming.z - current.z * upcoming.x; // cross product Y component
  const targetLean = Math.max(-0.2, Math.min(0.2, turn * 4));
  riderParts.torsoGroup.rotation.x = riderParts.torsoGroup.rotation.x * 0.92 + targetLean * 0.08;
  riderParts.headGroup.rotation.x = riderParts.headGroup.rotation.x * 0.92 + targetLean * 0.7 * 0.08;

  // Subtle head turn forward — always looking slightly ahead and down
  riderParts.headGroup.rotation.z = -0.08;

  // Hands twitch slightly with road bumps (very subtle)
  const handBob = Math.sin(time * 7) * 0.004;
  riderParts.handL.position.y = 1.26 + handBob;
  riderParts.handR.position.y = 1.26 - handBob;

  // Animate clouds — slow horizontal drift, wrap around
  clouds.forEach(cloud => {
    cloud.position.x += cloud.userData.driftSpeed;
    if (cloud.position.x > 60) cloud.position.x = -40;
  });

  // Animate birds — figure-8 flight + wing flap
  birds.forEach(bird => {
    const u = bird.userData;
    bird.position.x += u.speed;
    bird.position.y = u.flightY + Math.sin(time * 1.5 + u.wingPhase) * 0.5;
    bird.position.z = u.flightZ + Math.cos(time * 0.8 + u.wingPhase) * 2;
    if (bird.position.x > 50) bird.position.x = -50;
    // Wing flap
    const flap = Math.sin(time * 12 + u.wingPhase) * 0.5;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  });

  // Animate floating geometric shapes
  floaters.forEach(f => {
    f.rotation.x += f.userData.rotSpeed;
    f.rotation.y += f.userData.rotSpeed * 0.7;
    f.position.y = f.userData.baseY + Math.sin(time * f.userData.bobSpeed * 50) * f.userData.bobAmp;
  });

  // Animate active milestone ring (pulse)
  if (activeMilestone >= 0) {
    const ring = milestoneObjects[activeMilestone].ring;
    ring.scale.setScalar(1 + Math.sin(time * 3) * 0.15);
  }

  renderer.render(scene, camera);
}

// Initial camera position
camera.position.set(-6, 5, 6);
camera.lookAt(2, 0.5, 0);

// ====================================================
// RESIZE
// ====================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ====================================================
// CLICK BIKE → 360° ORBIT VIEW
// ====================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setOrbitMode(on) {
  cameraMode = on ? 'orbit' : 'follow';
  if (on) {
    orbitAngle = 0;
    showOrbitHint();
  } else {
    hideOrbitHint();
  }
  if (window.__refreshOrbitBtn) window.__refreshOrbitBtn();
}

// Show a small banner when in orbit mode telling user how to exit
function showOrbitHint() {
  let el = document.getElementById('orbitHint');
  if (!el) {
    el = document.createElement('div');
    el.id = 'orbitHint';
    el.style.cssText = `
      position: fixed; top: 7rem; left: 50%; transform: translateX(-50%);
      background: rgba(30, 58, 138, 0.95); color: white; padding: 0.7rem 1.4rem;
      border-radius: 100px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      letter-spacing: 0.1em; text-transform: uppercase; z-index: 20;
      box-shadow: 0 8px 24px rgba(30, 58, 138, 0.35); font-weight: 600;
      backdrop-filter: blur(8px); cursor: pointer;
    `;
    el.textContent = '◉ 360° view — click anywhere to exit';
    el.addEventListener('click', () => setOrbitMode(false));
    document.body.appendChild(el);
  }
  el.style.display = 'block';
}

function hideOrbitHint() {
  const el = document.getElementById('orbitHint');
  if (el) el.style.display = 'none';
}

function handleCanvasClick(clientX, clientY) {
  // Convert to normalized device coordinates
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  // Check if user clicked on the bike (recursive: matches any child mesh of the bike group)
  const hits = raycaster.intersectObject(bike, true);

  if (hits.length > 0 && cameraMode === 'follow') {
    // Clicked the bike → enter orbit mode
    setOrbitMode(true);
  } else if (cameraMode === 'orbit') {
    // Clicked elsewhere (or anywhere when in orbit mode) → exit orbit
    setOrbitMode(false);
  }
}

// Hover detection — change cursor to pointer when over the bike
canvas.addEventListener('mousemove', (e) => {
  if (cameraMode === 'orbit') {
    canvas.style.cursor = 'pointer';
    return;
  }
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(bike, true);
  canvas.style.cursor = hits.length > 0 ? 'pointer' : 'default';
});

// Click handler — but ignore clicks that originate from UI elements
canvas.addEventListener('click', (e) => {
  // Only respond to clicks on the canvas itself
  if (e.target === canvas) {
    handleCanvasClick(e.clientX, e.clientY);
  }
});

// Touch handler for mobile (tap to orbit / tap to exit)
canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0 && e.changedTouches.length > 0) {
    const t = e.changedTouches[0];
    handleCanvasClick(t.clientX, t.clientY);
  }
}, { passive: true });

// ESC key exits orbit mode
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && cameraMode === 'orbit') {
    setOrbitMode(false);
  }
});

// 360° View button — guaranteed-working toggle (in case raycaster has issues)
const orbitToggleBtn = document.getElementById('orbitToggleBtn');
if (orbitToggleBtn) {
  orbitToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setOrbitMode(cameraMode !== 'orbit');
    orbitToggleBtn.textContent = cameraMode === 'orbit' ? '✕ Exit 360° View' : '◉ 360° View';
  });
  // Update button label when orbit mode changes from other sources
  const _origSetOrbit = setOrbitMode;
  window.__refreshOrbitBtn = () => {
    orbitToggleBtn.textContent = cameraMode === 'orbit' ? '✕ Exit 360° View' : '◉ 360° View';
  };
}

// ====================================================
// START
// ====================================================
animate();

// Hide loader after a brief moment (everything's loaded by now)
setTimeout(() => {
  document.getElementById('loader').classList.add('hidden');
}, 800);

// Auto-ride to first milestone after a short pause for impact
setTimeout(() => {
  rideTo(0);
}, 1600);

</script>

</body>
