<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journey — Dinesh Ravichandiran</title>
<meta name="description" content="An interactive 3D ride through Dinesh's career journey from DRDO to NOC Specialist at PTC.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e3a8a'/%3E%3Ctext x='50' y='68' font-family='serif' font-size='52' font-weight='600' text-anchor='middle' fill='%23ffffff'%3EDR%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
–bg: #ffffff;
–text: #0a0a0a;
–text-secondary: #1f1f1f;
–text-muted: #404040;
–border: #e5e7eb;
–accent: #1e3a8a;
–accent-hover: #1e40af;
–accent-light: #eff6ff;
}

html, body {
margin: 0;
padding: 0;
overflow: hidden;
background: linear-gradient(to bottom, #e0e7ff 0%, #f5f7fb 60%, #ffffff 100%);
color: var(–text);
font-family: ‘Manrope’, -apple-system, BlinkMacSystemFont, sans-serif;
width: 100vw;
height: 100vh;
-webkit-font-smoothing: antialiased;
}

#canvas {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
display: block;
z-index: 0;
}

/* ===== BACK LINK ===== */
.back-link {
position: fixed;
top: 1.5rem;
left: 1.5rem;
z-index: 10;
padding: 0.6rem 1.1rem;
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(8px);
border: 1px solid var(–border);
border-radius: 6px;
color: var(–text);
text-decoration: none;
font-size: 0.85rem;
font-weight: 600;
display: inline-flex;
align-items: center;
gap: 0.5rem;
transition: all 0.2s;
}

.back-link:hover {
border-color: var(–accent);
color: var(–accent);
}

/* ===== HUD HEADER — hidden since milestones moved to top ===== */
.hud { display: none; }

/* ===== MILESTONE SELECTOR — TOP BAR ===== */
.milestones {
position: fixed;
top: 1.5rem;
left: 50%;
transform: translateX(-50%);
z-index: 10;
display: flex;
flex-direction: row;
gap: 0.4rem;
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(12px);
border: 1px solid var(–border);
border-radius: 100px;
padding: 0.5rem;
box-shadow: 0 10px 40px -10px rgba(30, 58, 138, 0.2);
max-width: calc(100vw - 200px);
overflow-x: auto;
scrollbar-width: none;
}

.milestones::-webkit-scrollbar { display: none; }

.milestones .ms-label { display: none; }

.milestone-btn {
background: transparent;
border: 1px solid transparent;
border-radius: 100px;
padding: 0.55rem 1.1rem;
text-align: center;
cursor: pointer;
font-family: ‘Manrope’, sans-serif;
transition: all 0.2s;
color: var(–text);
white-space: nowrap;
flex-shrink: 0;
user-select: none;
}

.milestone-btn:hover {
background: var(–accent-light);
color: var(–accent);
}

.milestone-btn:active {
transform: scale(0.96);
}

.milestone-btn.active {
background: var(–accent);
color: #ffffff;
box-shadow: 0 4px 14px rgba(30, 58, 138, 0.35);
}

.milestone-btn .ms-year {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.62rem;
font-weight: 600;
color: var(–accent);
display: block;
letter-spacing: 0.05em;
}

.milestone-btn.active .ms-year {
color: rgba(255, 255, 255, 0.85);
}

.milestone-btn .ms-name {
font-size: 0.85rem;
font-weight: 700;
display: block;
margin-top: 0.1rem;
}

.milestone-btn .ms-role { display: none; }

/* ===== INFO PANEL ===== */
.info-panel {
position: fixed;
bottom: 1.5rem;
left: 50%;
transform: translateX(-50%) translateY(120%);
z-index: 10;
width: min(640px, calc(100vw - 320px));
background: rgba(255, 255, 255, 0.97);
backdrop-filter: blur(12px);
border: 1px solid var(–border);
border-left: 4px solid var(–accent);
border-radius: 10px;
padding: 1.5rem 1.75rem;
box-shadow: 0 20px 60px -20px rgba(30, 58, 138, 0.2);
opacity: 0;
transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
}

.info-panel.visible {
transform: translateX(-50%) translateY(0);
opacity: 1;
}

.info-panel .info-meta {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.7rem;
color: var(–accent);
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.12em;
margin-bottom: 0.4rem;
}

.info-panel h2 {
font-size: 1.4rem;
font-weight: 700;
color: var(–text);
letter-spacing: -0.02em;
margin-bottom: 0.3rem;
}

.info-panel .info-role {
font-size: 0.95rem;
color: var(–text-secondary);
font-weight: 500;
margin-bottom: 0.8rem;
}

.info-panel .info-body {
font-size: 0.92rem;
color: var(–text-secondary);
line-height: 1.65;
margin-bottom: 0.8rem;
}

.info-panel .info-tags {
display: flex;
flex-wrap: wrap;
gap: 0.4rem;
}

.info-panel .info-tag {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.7rem;
color: var(–accent);
background: var(–accent-light);
padding: 0.25rem 0.65rem;
border-radius: 4px;
font-weight: 600;
}

/* ===== HINT ===== */
.hint {
position: fixed;
bottom: 1.5rem;
left: 1.5rem;
z-index: 10;
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.7rem;
color: var(–text-muted);
background: rgba(255, 255, 255, 0.9);
padding: 0.5rem 0.85rem;
border-radius: 6px;
border: 1px solid var(–border);
letter-spacing: 0.05em;
}

/* ===== LOADER ===== */
.loader {
position: fixed;
inset: 0;
background: #ffffff;
z-index: 100;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
gap: 1.5rem;
transition: opacity 0.5s;
}

.loader.hidden {
opacity: 0;
pointer-events: none;
}

.loader-text {
font-family: ‘JetBrains Mono’, monospace;
font-size: 0.85rem;
color: var(–accent);
font-weight: 600;
letter-spacing: 0.15em;
text-transform: uppercase;
}

.loader-bar {
width: 200px;
height: 2px;
background: var(–border);
border-radius: 2px;
overflow: hidden;
}

.loader-bar::before {
content: ‘’;
display: block;
width: 40%;
height: 100%;
background: var(–accent);
animation: loaderSlide 1.2s ease-in-out infinite;
}

@keyframes loaderSlide {
0% { transform: translateX(-100%); }
100% { transform: translateX(350%); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
.milestones {
top: 4rem;
max-width: calc(100vw - 1.5rem);
padding: 0.35rem;
}
.milestone-btn { padding: 0.45rem 0.8rem; }
.milestone-btn .ms-name { font-size: 0.75rem; }
.milestone-btn .ms-year { font-size: 0.55rem; }
.info-panel {
width: calc(100vw - 1.5rem);
left: 0.75rem;
right: 0.75rem;
transform: translateY(120%);
padding: 1.2rem;
}
.info-panel.visible { transform: translateY(0); }
.hint { display: none; }
.back-link { font-size: 0.75rem; padding: 0.5rem 0.85rem; }
}
</style>

</head>
<body>

<div class="loader" id="loader">
  <div class="loader-text">Loading the Journey</div>
  <div class="loader-bar"></div>
</div>

<canvas id="canvas"></canvas>

<a href="index.html" class="back-link">← Back to Portfolio</a>

<div class="hud">
  <h1>The Journey</h1>
  <div class="sub">2021 → Present · Career Path in 3D</div>
</div>

<div class="milestones" id="milestoneList">
  <div class="ms-label">⛛ Select a Stop</div>
  <!-- buttons injected by JS -->
</div>

<div class="info-panel" id="infoPanel">
  <div class="info-meta" id="infoMeta"></div>
  <h2 id="infoTitle"></h2>
  <div class="info-role" id="infoRole"></div>
  <p class="info-body" id="infoBody"></p>
  <div class="info-tags" id="infoTags"></div>
</div>

<div class="hint">↑ Click a milestone above to ride there</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Fallback if cdnjs is blocked
if (typeof THREE === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
}
</script>

<script>
// ====================================================
// THREE.JS LOAD CHECK
// ====================================================
if (typeof THREE === 'undefined') {
  document.getElementById('loader').innerHTML = `
    <div style="text-align: center; padding: 2rem; max-width: 400px;">
      <div style="font-size: 1.2rem; font-weight: 700; color: #1e3a8a; margin-bottom: 1rem;">3D Engine Failed to Load</div>
      <div style="font-size: 0.9rem; color: #404040; line-height: 1.6; margin-bottom: 1.5rem;">
        Three.js could not be loaded from the CDN. This may be due to a network restriction or ad-blocker.
      </div>
      <a href="index.html" style="display: inline-block; padding: 0.7rem 1.4rem; background: #1e3a8a; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">← Back to Portfolio</a>
    </div>
  `;
  throw new Error('Three.js not loaded');
}

// ====================================================
// CAREER DATA
// ====================================================
const MILESTONES = [
  {
    year: '2021',
    name: 'DRDO',
    role: 'R&D Engineering Intern',
    meta: '01 · The Start · Aug 2021',
    body: "Contributed to a defence R&D project at DRDO Avadi involving sensor integration for combat vehicle systems. Worked in a small team under DRDO supervision. The discipline of working on real-world, mission-critical hardware shaped my approach to reliability and documentation.",
    tags: ['Defence R&D', 'Sensor Integration', 'Hardware', 'Avadi, TN']
  },
  {
    year: 'Jan – Jun 2022',
    name: 'Cognizant',
    role: 'Programmer Analyst Trainee',
    meta: '02 · First Software Role · Bangalore',
    body: "Developed a CRUD-based Life Insurance Management application using Java, Spring Boot, and MySQL. Built REST APIs and documented setup procedures. First exposure to enterprise software development practices, version control, and team workflows.",
    tags: ['Java', 'Spring Boot', 'REST APIs', 'MySQL']
  },
  {
    year: 'Jul – Nov 2022',
    name: 'Johnson Controls',
    role: 'BMS Intern',
    meta: '03 · Smart Buildings · Pune',
    body: "Supported documentation for Building Management Systems solutions in smart building automation and energy management. Introduced me to enterprise-scale systems that real businesses depend on 24/7 — a preview of what was to come.",
    tags: ['BMS', 'Smart Buildings', 'Energy Management']
  },
  {
    year: 'Dec 2022 – Nov 2025',
    name: 'PTC',
    role: 'NOC Engineer – Associate',
    meta: '04 · The Foundation · 3 Years',
    body: "Production operations for Windchill, Windchill+, FlexPLM, and ThingWorx on Azure and AWS. Resolved 5,000+ incidents, maintained 99.9% uptime, reduced MTTR by ~30%. Authored team-wide runbooks, drove memory alert tuning, and was recognized with PTC's Customer First Award.",
    tags: ['5,000+ Incidents', '99.9% Uptime', '~30% MTTR ↓', 'Customer First Award', 'Azure & AWS']
  },
  {
    year: 'Dec 2025 – Present',
    name: 'PTC',
    role: 'NOC Engineer – Specialist',
    meta: '05 · Now · Specialist Track',
    body: "Driving incident response, root-cause analysis, and reliability initiatives for enterprise PLM and IIoT platforms. Lead outage coordination across App, DB, and Network teams. Mentor newer engineers and own runbook quality for the rotation. Targeting SRE roles at product-first companies.",
    tags: ['24×7 On-Call', 'Sev0–Sev3', 'Mentoring', 'RCA Lead', 'SRE Track']
  }
];

// ====================================================
// SETUP MILESTONE BUTTONS
// ====================================================
const msList = document.getElementById('milestoneList');
MILESTONES.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.className = 'milestone-btn';
  btn.dataset.index = i;
  btn.type = 'button';
  btn.setAttribute('aria-label', `Ride to ${m.name}, ${m.year}`);
  btn.innerHTML = `
    <span class="ms-year">${m.year}</span>
    <span class="ms-name">${m.name}</span>
    <span class="ms-role">${m.role}</span>
  `;
  const onSelect = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    console.log('[Journey] Riding to milestone', i, m.name);
    rideTo(i);
  };
  btn.addEventListener('click', onSelect);
  btn.addEventListener('touchend', onSelect, { passive: false });
  msList.appendChild(btn);
});

// ====================================================
// THREE.JS SETUP
// ====================================================
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf5f7fb, 30, 90);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ====================================================
// LIGHTING
// ====================================================
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0xeff6ff, 0.3);
fillLight.position.set(-15, 10, -10);
scene.add(fillLight);

// ====================================================
// GROUND
// ====================================================
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshLambertMaterial({ color: 0xf0f3f8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// Grid (subtle)
const grid = new THREE.GridHelper(200, 80, 0xd4dde8, 0xe6ebf3);
grid.position.y = 0;
scene.add(grid);

// ====================================================
// ROAD PATH (Curve)
// ====================================================
const pathPoints = [
  new THREE.Vector3(0, 0, 0),       // Start
  new THREE.Vector3(8, 0, -4),      // Milestone 0: DRDO
  new THREE.Vector3(16, 0, 2),      // Milestone 1: Cognizant
  new THREE.Vector3(24, 0, -3),     // Milestone 2: Johnson Controls
  new THREE.Vector3(34, 0, 4),      // Milestone 3: PTC Associate
  new THREE.Vector3(46, 0, -2),     // Milestone 4: PTC Specialist
  new THREE.Vector3(54, 0, 0)       // End buffer
];

// Adjust milestone positions so they align with curve sample points
const curve = new THREE.CatmullRomCurve3(pathPoints, false, 'catmullrom', 0.4);

// Build a flat road geometry along the curve
const ROAD_WIDTH = 1.8;
const roadSegments = 200;
const roadShape = [];
const roadIndices = [];
const upVec = new THREE.Vector3(0, 1, 0);

for (let i = 0; i <= roadSegments; i++) {
  const t = i / roadSegments;
  const point = curve.getPointAt(t);
  const tangent = curve.getTangentAt(t).normalize();
  const side = new THREE.Vector3().crossVectors(tangent, upVec).normalize();

  const left = point.clone().addScaledVector(side, ROAD_WIDTH / 2);
  const right = point.clone().addScaledVector(side, -ROAD_WIDTH / 2);
  roadShape.push(left.x, 0.01, left.z);
  roadShape.push(right.x, 0.01, right.z);

  if (i < roadSegments) {
    const a = i * 2;
    const b = i * 2 + 1;
    const c = (i + 1) * 2;
    const d = (i + 1) * 2 + 1;
    roadIndices.push(a, c, b, b, c, d);
  }
}

const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadShape, 3));
roadGeo.setIndex(roadIndices);
roadGeo.computeVertexNormals();
const roadMat = new THREE.MeshLambertMaterial({ color: 0x334155, side: THREE.DoubleSide });
const road = new THREE.Mesh(roadGeo, roadMat);
road.receiveShadow = true;
scene.add(road);

// Center stripe (dashed)
const stripePoints = [];
for (let i = 0; i <= roadSegments; i += 4) {
  const t = i / roadSegments;
  stripePoints.push(curve.getPointAt(t).setY(0.02));
}
const stripeGeo = new THREE.BufferGeometry().setFromPoints(stripePoints);
const stripeMat = new THREE.LineDashedMaterial({
  color: 0xfacc15,
  dashSize: 0.4,
  gapSize: 0.3,
  linewidth: 2
});
const stripe = new THREE.Line(stripeGeo, stripeMat);
stripe.computeLineDistances();
scene.add(stripe);

// ====================================================
// MILESTONE POSTS (one for each career stop)
// ====================================================
// Map each milestone to a t-value along the curve
const milestoneT = [0.10, 0.28, 0.47, 0.66, 0.86];
const milestoneObjects = [];

function buildMilestone(t, index, data) {
  const pos = curve.getPointAt(t);
  const tangent = curve.getTangentAt(t).normalize();
  const side = new THREE.Vector3().crossVectors(tangent, upVec).normalize();
  const offset = side.clone().multiplyScalar(2.2);

  const group = new THREE.Group();
  group.position.copy(pos.clone().add(offset));

  // Post (taller, more prominent)
  const postGeo = new THREE.CylinderGeometry(0.08, 0.1, 2.4, 8);
  const postMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
  const post = new THREE.Mesh(postGeo, postMat);
  post.position.y = 1.2;
  post.castShadow = true;
  group.add(post);

  // Post base (decorative)
  const baseGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.15, 12);
  const base = new THREE.Mesh(baseGeo, postMat);
  base.position.y = 0.08;
  base.castShadow = true;
  group.add(base);

  // Sign board (BIGGER — wider plate)
  const signGeo = new THREE.BoxGeometry(2.4, 1.1, 0.1);
  const signMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const sign = new THREE.Mesh(signGeo, signMat);
  sign.position.y = 2.6;
  sign.castShadow = true;
  group.add(sign);

  // Sign border (navy frame)
  const borderGeo = new THREE.BoxGeometry(2.55, 1.25, 0.06);
  const borderMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
  const border = new THREE.Mesh(borderGeo, borderMat);
  border.position.y = 2.6;
  border.position.z = -0.03;
  group.add(border);

  // Company name + year texture (the white plate showing names)
  const tex = makeCompanySignTexture(data.name, data.year, index + 1);
  const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
  const textGeo = new THREE.PlaneGeometry(2.3, 1.0);
  const textMesh = new THREE.Mesh(textGeo, textMat);
  textMesh.position.y = 2.6;
  textMesh.position.z = 0.06;
  group.add(textMesh);

  // Same content on the BACK of the sign (so it's readable from both directions)
  const textBack = new THREE.Mesh(textGeo, textMat);
  textBack.position.y = 2.6;
  textBack.position.z = -0.06;
  textBack.rotation.y = Math.PI;
  group.add(textBack);

  // Make the whole sign face the road (turn slightly toward the bike's path)
  const lookTarget = pos.clone();
  group.lookAt(lookTarget.x, group.position.y, lookTarget.z);

  // Glow ring at base (pulses when active)
  const ringGeo = new THREE.RingGeometry(0.8, 1.1, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x1e3a8a,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  ring.position.copy(pos);
  ring.position.y = 0.02;
  scene.add(ring);

  scene.add(group);
  milestoneObjects.push({ group, ring, pos });
}

function makeCompanySignTexture(name, year, num) {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 448;
  const ctx = c.getContext('2d');

  // White background with subtle gradient
  const grad = ctx.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#f8fafc');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, c.width, c.height);

  // Inner navy border
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 6;
  ctx.strokeRect(20, 20, c.width - 40, c.height - 40);

  // Step number badge (top-left circle)
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  ctx.arc(85, 85, 45, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 56px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num.toString(), 85, 88);

  // Company name (main)
  ctx.fillStyle = '#0a0a0a';
  ctx.font = 'bold 90px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Truncate very long names for the sign
  let displayName = name;
  if (displayName.length > 18) {
    ctx.font = 'bold 68px Manrope, sans-serif';
  }
  ctx.fillText(displayName, c.width / 2, c.height / 2 - 10);

  // Year (subtitle)
  ctx.fillStyle = '#1e3a8a';
  ctx.font = '600 38px JetBrains Mono, monospace';
  ctx.fillText(year, c.width / 2, c.height / 2 + 75);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 4;
  return tex;
}

milestoneT.forEach((t, i) => buildMilestone(t, i, MILESTONES[i]));

// ====================================================
// DECORATIVE TREES / BUSHES
// ====================================================
function addTree(x, z, scale = 1) {
  const group = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.6, 6);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b5b4d });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 0.3;
  trunk.castShadow = true;
  group.add(trunk);

  const leavesGeo = new THREE.ConeGeometry(0.5, 1.2, 6);
  const leavesMat = new THREE.MeshLambertMaterial({ color: 0x3f6b3a });
  const leaves = new THREE.Mesh(leavesGeo, leavesMat);
  leaves.position.y = 1.2;
  leaves.castShadow = true;
  group.add(leaves);

  group.position.set(x, 0, z);
  group.scale.setScalar(scale * (0.8 + Math.random() * 0.5));
  group.rotation.y = Math.random() * Math.PI;
  scene.add(group);
}

// Scatter trees away from the road
function isNearRoad(x, z, threshold = 3.5) {
  for (let i = 0; i <= 30; i++) {
    const t = i / 30;
    const p = curve.getPointAt(t);
    const dx = p.x - x, dz = p.z - z;
    if (dx * dx + dz * dz < threshold * threshold) return true;
  }
  return false;
}

for (let i = 0; i < 60; i++) {
  let x, z, tries = 0;
  do {
    x = (Math.random() - 0.3) * 60;
    z = (Math.random() - 0.5) * 30;
    tries++;
  } while (isNearRoad(x, z) && tries < 20);
  if (!isNearRoad(x, z)) addTree(x, z);
}

const clouds = [];
function makeCloud(x, y, z, scale) {
  const cloud = new THREE.Group();
  const cloudMat = new THREE.MeshLambertMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.85
  });
  // 3-5 puffs grouped to form a cloud
  const puffCount = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < puffCount; i++) {
    const r = 0.7 + Math.random() * 0.5;
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry(r, 8, 6),
      cloudMat
    );
    puff.position.set(
      (i - puffCount / 2) * 0.9,
      Math.random() * 0.3,
      Math.random() * 0.4 - 0.2
    );
    cloud.add(puff);
  }
  cloud.position.set(x, y, z);
  cloud.scale.setScalar(scale);
  cloud.userData.driftSpeed = 0.005 + Math.random() * 0.008;
  cloud.userData.startX = x;
  scene.add(cloud);
  clouds.push(cloud);
}

let currentT = 0;
let targetT = 0;
const cameraOffset = new THREE.Vector3(-4, 3.2, 4.5);

function updateBikePosition(delta) {
  // Ease toward target
  const lerpSpeed = 0.04;
  currentT += (targetT - currentT) * lerpSpeed;
  currentT = Math.max(0, Math.min(1, currentT));

  const pos = curve.getPointAt(currentT);
  bike.position.set(pos.x, 0, pos.z);

  // Orient bike along tangent
  const tangent = curve.getTangentAt(currentT).normalize();
  const angle = Math.atan2(tangent.x, tangent.z);
  bike.rotation.y = angle - Math.PI / 2;

  // Spin wheels based on movement
  const movement = Math.abs(targetT - currentT) * 30;
  wheelF.rotation.x -= 0.1 + movement * 0.3;
  wheelB.rotation.x -= 0.1 + movement * 0.3;

  // Camera follows (with mouse parallax offset baked in)
  const tangentDir = curve.getTangentAt(currentT).normalize();
  const behind = tangentDir.clone().multiplyScalar(-5);
  const parallaxX = mouse.x * 1.5;
  const parallaxY = -mouse.y * 0.8;
  const targetCamPos = new THREE.Vector3(
    pos.x + behind.x + parallaxX,
    pos.y + 3.5 + parallaxY,
    pos.z + behind.z
  );
  camera.position.lerp(targetCamPos, 0.06);

  const lookAhead = curve.getPointAt(Math.min(currentT + 0.05, 1));
  camera.lookAt(lookAhead.x + parallaxX * 0.3, 1.0, lookAhead.z);
}

// ====================================================
// RIDE TO MILESTONE
// ====================================================
let activeMilestone = -1;

function rideTo(index) {
  targetT = milestoneT[index];
  activeMilestone = index;

  // Update button states
  document.querySelectorAll('.milestone-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  // Hide info panel during transition
  const panel = document.getElementById('infoPanel');
  panel.classList.remove('visible');

  // Pulse the destination ring
  milestoneObjects.forEach((m, i) => {
    m.ring.material.opacity = 0;
  });

  // Show info after arrival
  clearTimeout(window._arriveTimer);
  window._arriveTimer = setTimeout(() => {
    showInfo(index);
    milestoneObjects[index].ring.material.opacity = 0.6;
  }, 1400);
}

function showInfo(index) {
  const m = MILESTONES[index];
  document.getElementById('infoMeta').textContent = m.meta;
  document.getElementById('infoTitle').textContent = m.name;
  document.getElementById('infoRole').textContent = m.role;
  document.getElementById('infoBody').textContent = m.body;
  const tagsEl = document.getElementById('infoTags');
  tagsEl.innerHTML = '';
  m.tags.forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'info-tag';
    tag.textContent = t;
    tagsEl.appendChild(tag);
  });
  document.getElementById('infoPanel').classList.add('visible');
}

// ====================================================
// ANIMATE
// ====================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.elapsedTime;

  // Smooth mouse follow (used by camera parallax inside updateBikePosition)
  mouse.x += (mouse.targetX - mouse.x) * 0.05;
  mouse.y += (mouse.targetY - mouse.y) * 0.05;

  updateBikePosition(delta);

  // Animate clouds — slow horizontal drift, wrap around
  clouds.forEach(cloud => {
    cloud.position.x += cloud.userData.driftSpeed;
    if (cloud.position.x > 60) cloud.position.x = -40;
  });

  // Animate birds — figure-8 flight + wing flap
  birds.forEach(bird => {
    const u = bird.userData;
    bird.position.x += u.speed;
    bird.position.y = u.flightY + Math.sin(time * 1.5 + u.wingPhase) * 0.5;
    bird.position.z = u.flightZ + Math.cos(time * 0.8 + u.wingPhase) * 2;
    if (bird.position.x > 50) bird.position.x = -50;
    // Wing flap
    const flap = Math.sin(time * 12 + u.wingPhase) * 0.5;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  });

  // Animate floating geometric shapes
  floaters.forEach(f => {
    f.rotation.x += f.userData.rotSpeed;
    f.rotation.y += f.userData.rotSpeed * 0.7;
    f.position.y = f.userData.baseY + Math.sin(time * f.userData.bobSpeed * 50) * f.userData.bobAmp;
  });

  // Animate active milestone ring (pulse)
  if (activeMilestone >= 0) {
    const ring = milestoneObjects[activeMilestone].ring;
    ring.scale.setScalar(1 + Math.sin(time * 3) * 0.15);
  }

  renderer.render(scene, camera);
}

// Initial camera position
camera.position.set(-6, 5, 6);
camera.lookAt(2, 0.5, 0);

// ====================================================
// RESIZE
// ====================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ====================================================
// START
// ====================================================
animate();

// Hide loader after a brief moment (everything's loaded by now)
setTimeout(() => {
  document.getElementById('loader').classList.add('hidden');
}, 800);

// Auto-ride to first milestone after a short pause for impact
setTimeout(() => {
  rideTo(0);
}, 1600);

</script>
