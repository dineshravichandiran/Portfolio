<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journey — Dinesh Ravichandiran</title>
<meta name="description" content="An interactive 3D ride through Dinesh's career journey from DRDO to Cloud Services NOC Engineer at PTC.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e3a8a'/%3E%3Ctext x='50' y='68' font-family='serif' font-size='52' font-weight='600' text-anchor='middle' fill='%23ffffff'%3EDR%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #ffffff;
  --text: #0a0a0a;
  --text-secondary: #1f1f1f;
  --text-muted: #404040;
  --border: #e5e7eb;
  --accent: #1e3a8a;
  --accent-hover: #1e40af;
  --accent-light: #eff6ff;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(to bottom, #87ceeb 0%, #b8dcf0 45%, #d8ecf5 75%, #e8f4e0 100%);
  color: var(--text);
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  width: 100vw;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
}

#canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  z-index: 0;
}

/* ===== BACK LINK ===== */
.back-link {
  position: fixed;
  top: 1.5rem;
  left: 1.5rem;
  z-index: 10;
  padding: 0.6rem 1.1rem;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  transition: all 0.2s;
}

.back-link:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ===== HUD HEADER — hidden since milestones moved to top ===== */
.hud { display: none; }

/* ===== MILESTONE SELECTOR — TOP BAR ===== */
.milestones {
  position: fixed;
  top: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: row;
  gap: 0.4rem;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 0.5rem;
  box-shadow: 0 10px 40px -10px rgba(30, 58, 138, 0.2);
  max-width: calc(100vw - 200px);
  overflow-x: auto;
  scrollbar-width: none;
}

.milestones::-webkit-scrollbar { display: none; }

.milestones .ms-label { display: none; }

.milestone-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 100px;
  padding: 0.55rem 1.1rem;
  text-align: center;
  cursor: pointer;
  font-family: 'Manrope', sans-serif;
  transition: all 0.2s;
  color: var(--text);
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
}

.milestone-btn:hover {
  background: var(--accent-light);
  color: var(--accent);
}

.milestone-btn:active {
  transform: scale(0.96);
}

.milestone-btn.active {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(30, 58, 138, 0.35);
}

.milestone-btn .ms-year {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  font-weight: 600;
  color: var(--accent);
  display: block;
  letter-spacing: 0.05em;
}

.milestone-btn.active .ms-year {
  color: rgba(255, 255, 255, 0.85);
}

.milestone-btn .ms-name {
  font-size: 0.85rem;
  font-weight: 700;
  display: block;
  margin-top: 0.1rem;
}

.milestone-btn .ms-role { display: none; }

/* ===== INFO PANEL ===== */
.info-panel {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  z-index: 10;
  width: min(720px, calc(100vw - 4rem));
  max-height: 60vh;
  overflow-y: auto;
  background: rgba(255, 255, 255, 0.99);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  border-radius: 12px;
  padding: 1.75rem 2rem;
  box-shadow: 0 24px 60px -16px rgba(30, 58, 138, 0.3);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
}

.info-panel.visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.info-panel .info-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 0.6rem;
}

.info-panel h2 {
  font-size: 1.75rem;
  font-weight: 800;
  color: #0a0a0a;
  letter-spacing: -0.02em;
  margin-bottom: 0.4rem;
  line-height: 1.15;
}

.info-panel .info-role {
  font-size: 1.05rem;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 1rem;
}

.info-panel .info-body {
  font-size: 1rem;
  color: #1f1f1f;
  line-height: 1.7;
  margin-bottom: 1.2rem;
  font-weight: 400;
}

.info-panel .info-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.info-panel .info-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--accent);
  background: var(--accent-light);
  padding: 0.4rem 0.85rem;
  border-radius: 6px;
  font-weight: 600;
  border: 1px solid rgba(30, 58, 138, 0.15);
}

/* ===== HINT ===== */
.hint {
  position: fixed;
  bottom: 1.5rem;
  left: 1.5rem;
  z-index: 10;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.9);
  padding: 0.5rem 0.85rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  letter-spacing: 0.05em;
}

/* ===== LOADER ===== */
.loader {
  position: fixed;
  inset: 0;
  background: #ffffff;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1.5rem;
  transition: opacity 0.5s;
}

.loader.hidden {
  opacity: 0;
  pointer-events: none;
}

.loader-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.loader-bar {
  width: 200px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.loader-bar::before {
  content: '';
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: loaderSlide 1.2s ease-in-out infinite;
}

@keyframes loaderSlide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .milestones {
    top: 4rem;
    max-width: calc(100vw - 1.5rem);
    padding: 0.35rem;
  }
  .milestone-btn { padding: 0.45rem 0.8rem; }
  .milestone-btn .ms-name { font-size: 0.75rem; }
  .milestone-btn .ms-year { font-size: 0.55rem; }
  .info-panel {
    width: calc(100vw - 1.5rem);
    left: 0.75rem;
    right: 0.75rem;
    transform: translateY(120%);
    padding: 1.2rem;
  }
  .info-panel.visible { transform: translateY(0); }
  .hint { display: none; }
  .back-link { font-size: 0.75rem; padding: 0.5rem 0.85rem; }
}
</style>
</head>

  background: rgba(30, 58, 138, 0.95); color: white; border: none;

<script>
// ====================================================
// THREE.JS LOAD CHECK
// ====================================================
if (typeof THREE === 'undefined') {
  document.getElementById('loader').innerHTML = `
    <div style="text-align: center; padding: 2rem; max-width: 400px;">
      <div style="font-size: 1.2rem; font-weight: 700; color: #1e3a8a; margin-bottom: 1rem;">3D Engine Failed to Load</div>
      <div style="font-size: 0.9rem; color: #404040; line-height: 1.6; margin-bottom: 1.5rem;">
        Three.js could not be loaded from the CDN. This may be due to a network restriction or ad-blocker.
      </div>
      <a href="index.html" style="display: inline-block; padding: 0.7rem 1.4rem; background: #1e3a8a; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">← Back to Portfolio</a>
    </div>
  `;
  throw new Error('Three.js not loaded');
}

// ====================================================
// CAREER DATA
// ====================================================
const MILESTONES = [
  {
    year: '2021',
    city: 'CHENNAI',
    name: 'DRDO',
    role: 'R&D Engineering Intern',
    meta: '01 · CHENNAI · Aug 2021',
    body: "Contributed to a defence R&D project at DRDO Avadi — sensor integration for combat vehicle systems. Working on mission-critical hardware shaped my approach to reliability and documentation.",
    tags: ['Defence R&D', 'Sensor Integration', 'Reliability Mindset', 'Technical Documentation']
  },
  {
    year: 'Jan – Jun 2022',
    city: 'BANGALORE',
    name: 'Cognizant',
    role: 'Programmer Analyst Trainee',
    meta: '02 · BANGALORE · First Software Role',
    body: "Six-month paid internship — trained in full-stack fundamentals and SQL, then specialized in Java, building a Spring Boot MVC project with MySQL. Earned a full-time offer on performance.",
    tags: ['Java', 'Spring Boot', 'REST APIs', 'MySQL', 'Earned Full-time Offer']
  },
  {
    year: 'Dec 2022 – Nov 2025',
    city: 'PUNE',
    name: 'PTC',
    role: 'Cloud Services Associate NOC Engineer',
    meta: '03 · PUNE · The Foundation',
    body: "Resolved 5,000+ production incidents across AWS and Azure with 99.9% uptime for 50+ Fortune 500 environments. Memory RCA over 2.5 years with the Technical Architect team. Linux, Apache and Tomcat across 200+ servers; logs in Sumo Logic and CloudWatch. Recognized with PTC's Customer First Award.",
    tags: ['Incident Management', 'Root Cause Analysis', 'Linux & Tomcat', 'Sumo Logic', '99.9% Uptime', 'Customer First Award']
  },
  {
    year: 'Nov 2025 – Present',
    city: 'PUNE',
    name: 'PTC',
    role: 'Cloud Services Specialist NOC Engineer',
    meta: '04 · PUNE · Now',
    body: "24×7 production support on AWS and Azure for 50+ Fortune 500 customers. Lead incident response and RCA. Kubernetes (AKS) pod- and node-level troubleshooting with kubectl and k9s — CrashLoopBackOff, OOMKilled, scale-downs. Log analysis, performance tuning, and runbook automation. Growing fast and ready for the next challenge.",
    tags: ['Kubernetes (AKS)', 'Incident Response', 'Observability', 'Automation', 'AWS & Azure', 'Linux']
  }
];

// ====================================================
// SETUP MILESTONE BUTTONS
// ====================================================
const msList = document.getElementById('milestoneList');
MILESTONES.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.className = 'milestone-btn';
  btn.dataset.index = i;
  btn.type = 'button';
  btn.setAttribute('aria-label', `Ride to ${m.name}, ${m.year}`);
  btn.innerHTML = `
    <span class="ms-year">${m.year}</span>
    <span class="ms-name">${m.name}</span>
    <span class="ms-role">${m.role}</span>
  `;
  const onSelect = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    console.log('[Journey] Riding to milestone', i, m.name);
    rideTo(i);
  };
  btn.addEventListener('click', onSelect);
  btn.addEventListener('touchend', onSelect, { passive: false });
  msList.appendChild(btn);
});

// ====================================================
// THREE.JS SETUP
// ====================================================
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc5dcf0, 35, 100);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ====================================================
// LIGHTING
// ====================================================
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0xeff6ff, 0.3);
fillLight.position.set(-15, 10, -10);
scene.add(fillLight);

// ====================================================
// GROUND
// ====================================================
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x9cb86a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// Zone-tinted ground patches (only on either side of the road, not on road itself)
function addZonePatch(xCenter, xWidth, color, opacity) {
  const patchGeo = new THREE.PlaneGeometry(xWidth, 80);
  const patchMat = new THREE.MeshLambertMaterial({ color, transparent: true, opacity });
  // Left strip
  const patchL = new THREE.Mesh(patchGeo, patchMat);
  patchL.rotation.x = -Math.PI / 2;
  patchL.position.set(xCenter, 0, -42);
  scene.add(patchL);
  // Right strip
  const patchR = new THREE.Mesh(patchGeo, patchMat);
  patchR.rotation.x = -Math.PI / 2;
  patchR.position.set(xCenter, 0, 42);
  scene.add(patchR);
}

// Chennai zone — sandy coastal tint (subtle)
addZonePatch(7, 20, 0xd4c896, 0.25);
// Bangalore zone — lush green (subtle)
addZonePatch(25, 20, 0x8db05a, 0.25);
// Pune zone — drier tan (subtle)
addZonePatch(48, 25, 0xc4b888, 0.25);

// (Grid removed for realistic grass look)

// ====================================================
// ROAD PATH (Curve)
// ====================================================
const pathPoints = [
  new THREE.Vector3(0, 0, 0),       // Start
  new THREE.Vector3(12, 0, -2),     // Milestone 0: DRDO — Chennai (gentle left curve)
  new THREE.Vector3(24, 0, 1.8),    // Milestone 1: Cognizant — Bangalore (back right)
  new THREE.Vector3(38, 0, -1.5),   // Milestone 2: PTC Associate — Pune
  new THREE.Vector3(50, 0, 1.5),    // Milestone 3: PTC Specialist — Pune
  new THREE.Vector3(60, 0, 0)       // End buffer
];

// Gentle highway curves (tension 0.3 = smooth banks, not sharp turns)
const curve = new THREE.CatmullRomCurve3(pathPoints, false, 'catmullrom', 0.3);

// Build a flat road geometry along the curve
const ROAD_WIDTH = 2.2;
const roadSegments = 200;
const roadShape = [];
const roadIndices = [];
const upVec = new THREE.Vector3(0, 1, 0);

for (let i = 0; i <= roadSegments; i++) {
  const t = i / roadSegments;
  const point = curve.getPointAt(t);
  const tangent = curve.getTangentAt(t).normalize();
  const side = new THREE.Vector3().crossVectors(tangent, upVec).normalize();

  const left = point.clone().addScaledVector(side, ROAD_WIDTH / 2);
  const right = point.clone().addScaledVector(side, -ROAD_WIDTH / 2);
  roadShape.push(left.x, 0.01, left.z);
  roadShape.push(right.x, 0.01, right.z);

  if (i < roadSegments) {
    const a = i * 2;
    const b = i * 2 + 1;
    const c = (i + 1) * 2;
    const d = (i + 1) * 2 + 1;
    roadIndices.push(a, c, b, b, c, d);
  }
}

const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadShape, 3));
roadGeo.setIndex(roadIndices);
roadGeo.computeVertexNormals();
const roadMat = new THREE.MeshLambertMaterial({ color: 0x334155, side: THREE.DoubleSide });
const road = new THREE.Mesh(roadGeo, roadMat);
road.receiveShadow = true;
scene.add(road);

// Center stripe (dashed)
const stripePoints = [];
for (let i = 0; i <= roadSegments; i += 4) {
  const t = i / roadSegments;
  stripePoints.push(curve.getPointAt(t).setY(0.02));
}
const stripeGeo = new THREE.BufferGeometry().setFromPoints(stripePoints);
const stripeMat = new THREE.LineDashedMaterial({
  color: 0xfacc15,
  dashSize: 0.4,
  gapSize: 0.3,
  linewidth: 2
});
const stripe = new THREE.Line(stripeGeo, stripeMat);
stripe.computeLineDistances();
scene.add(stripe);

// ====================================================
// MILESTONE POSTS (one for each career stop)
// ====================================================
// Map each milestone to a t-value along the curve
const milestoneT = [0.12, 0.36, 0.62, 0.86];
const milestoneObjects = [];

function buildMilestone(t, index, data) {
  const pos = curve.getPointAt(t);
  const tangent = curve.getTangentAt(t).normalize();
  const side = new THREE.Vector3().crossVectors(tangent, upVec).normalize();
  const offset = side.clone().multiplyScalar(2.2);

  const group = new THREE.Group();
  group.position.copy(pos.clone().add(offset));

  // Post — rises up to overlap the sign's lower edge so there's no floating gap
  // Sign center y=2.35, height 1.4 → sign bottom at y=1.65. Post top reaches y=2.0 (overlaps, hidden behind sign).
  const postGeo = new THREE.CylinderGeometry(0.09, 0.11, 2.0, 8);
  const postMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
  const post = new THREE.Mesh(postGeo, postMat);
  post.position.set(0, 1.0, 0.06);
  post.castShadow = true;
  group.add(post);

  // Post base (decorative)
  const baseGeo = new THREE.CylinderGeometry(0.2, 0.24, 0.18, 12);
  const base = new THREE.Mesh(baseGeo, postMat);
  base.position.set(0, 0.09, 0.06);
  base.castShadow = true;
  group.add(base);

  // Sign board — CURVED billboard with text always readable
  const tex = makeCompanySignTexture(data.name, data.year, index + 1);

  // Use BufferGeometry to build a gently curved plane (less curve = clearer text)
  const SIGN_WIDTH = 3.0;
  const SIGN_HEIGHT = 1.4;
  const SIGN_CURVE_DEPTH = 0.12;
  const SEGMENTS = 16;

  function buildCurvedSign(material, width, height, depth) {
    const geo = new THREE.BufferGeometry();
    const positions = [];
    const uvs = [];
    const indices = [];

    // Build a grid of vertices curved along the X axis
    for (let i = 0; i <= SEGMENTS; i++) {
      const u = i / SEGMENTS;
      const x = (u - 0.5) * width;
      // Parabolic curve depth: zero at edges, max at center
      const z = -depth * (1 - Math.pow(2 * u - 1, 2));
      // Two rows of vertices: top and bottom
      positions.push(x, height / 2, z);
      positions.push(x, -height / 2, z);
      uvs.push(u, 1);
      uvs.push(u, 0);
    }
    // Triangulate
    for (let i = 0; i < SEGMENTS; i++) {
      const a = i * 2;
      const b = i * 2 + 1;
      const c = (i + 1) * 2;
      const d = (i + 1) * 2 + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }

    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, material);
  }

  // FRONT face (texture, double-sided so it shows from the back too)
  const signFront = buildCurvedSign(
    new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide }),
    SIGN_WIDTH, SIGN_HEIGHT, SIGN_CURVE_DEPTH
  );
  signFront.position.y = 2.35;
  signFront.castShadow = true;
  group.add(signFront);

  // Navy frame BEHIND the sign (slightly larger)
  const signFrame = buildCurvedSign(
    new THREE.MeshLambertMaterial({ color: 0x1e3a8a, side: THREE.DoubleSide }),
    SIGN_WIDTH + 0.15, SIGN_HEIGHT + 0.18, SIGN_CURVE_DEPTH + 0.04
  );
  signFrame.position.y = 2.35;
  signFrame.position.z = 0.02;
  group.add(signFrame);

  // Make whole sign face the road: the CONVEX side (-Z direction) points outward
  // group.lookAt() points the local -Z axis at the target, which is exactly what we want
  group.lookAt(pos.x, group.position.y, pos.z);

  // Glow ring at base (pulses when active)
  const ringGeo = new THREE.RingGeometry(0.8, 1.1, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x1e3a8a,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  ring.position.copy(pos);
  ring.position.y = 0.02;
  scene.add(ring);

  scene.add(group);
  milestoneObjects.push({ group, ring, pos });
}

function makeCompanySignTexture(name, year, num) {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 448;
  const ctx = c.getContext('2d');

  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, c.width, c.height);

  // Navy top band (holds the step number + makes the card pop)
  ctx.fillStyle = '#1e3a8a';
  ctx.fillRect(0, 0, c.width, 70);

  // Thick navy border
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 10;
  ctx.strokeRect(14, 14, c.width - 28, c.height - 28);

  // Step number badge (in the top band)
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.arc(70, 35, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1e3a8a';
  ctx.font = 'bold 32px Arial, Helvetica, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num.toString(), 70, 36);

  // Company name — BIG, black, bold, auto-fit with system font
  ctx.fillStyle = '#0a0a0a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxNameWidth = c.width - 120;
  let nameFontSize = 120;
  ctx.font = `bold ${nameFontSize}px Arial, Helvetica, sans-serif`;
  while (ctx.measureText(name).width > maxNameWidth && nameFontSize > 44) {
    nameFontSize -= 4;
    ctx.font = `bold ${nameFontSize}px Arial, Helvetica, sans-serif`;
  }
  ctx.fillText(name, c.width / 2, 230);

  // Year (subtitle) — navy, auto-fit
  ctx.fillStyle = '#1e3a8a';
  const maxYearWidth = c.width - 120;
  let yearFontSize = 52;
  ctx.font = `bold ${yearFontSize}px Arial, Helvetica, sans-serif`;
  while (ctx.measureText(year).width > maxYearWidth && yearFontSize > 26) {
    yearFontSize -= 2;
    ctx.font = `bold ${yearFontSize}px Arial, Helvetica, sans-serif`;
  }
  ctx.fillText(year, c.width / 2, 340);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 8;
  return tex;
}

// Zones along the road (road runs x=0 to x=60)
const ZONES = {
  CHENNAI:   { xStart: -5,  xEnd: 15 },
  BANGALORE: { xStart: 15,  xEnd: 35 },
  PUNE:      { xStart: 35,  xEnd: 65 }
};

// Milestone sign positions to avoid placing objects on top of
const MILESTONE_EXCLUSION_X = [6, 17, 28, 40, 52];
const MILESTONE_EXCLUSION_RADIUS = 5;

// Landmark positions (Marina Beach, Vidhana Soudha, Shaniwar Wada) — keep a BIG clear
// space around each so scenery buildings never hide them.
const LANDMARK_EXCLUSION = [
  { x: 7,  z: -8 },   // Chennai - Marina Beach
  { x: 18, z: -13 },  // Bangalore - Vidhana Soudha
  { x: 46, z: -9 },   // Pune - Shaniwar Wada
];
const LANDMARK_EXCLUSION_RADIUS = 11;

function randomInZone(zone, minDist = 4, maxDist = 16) {
  for (let tries = 0; tries < 40; tries++) {
    const x = zone.xStart + Math.random() * (zone.xEnd - zone.xStart);
    const side = Math.random() < 0.5 ? 1 : -1;
    const z = side * (minDist + Math.random() * (maxDist - minDist));
    let tooClose = false;
    for (const mx of MILESTONE_EXCLUSION_X) {
      const dx = x - mx;
      const dz = z - (side > 0 ? 2.2 : 0);
      if (Math.sqrt(dx * dx + dz * dz) < MILESTONE_EXCLUSION_RADIUS) { tooClose = true; break; }
    }
    // Keep clear of landmarks so they are never hidden
    if (!tooClose) {
      for (const lm of LANDMARK_EXCLUSION) {
        const dx = x - lm.x;
        const dz = z - lm.z;
        if (Math.sqrt(dx * dx + dz * dz) < LANDMARK_EXCLUSION_RADIUS) { tooClose = true; break; }
      }
    }
    if (!tooClose) return { x, z };
  }
  return { x: zone.xStart + Math.random() * (zone.xEnd - zone.xStart), z: (Math.random() < 0.5 ? 1 : -1) * (maxDist + 4) };
}

function addBuilding(x, z, side) {

  // Main body

  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  // Flat roof slab with slight overhang
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.15, 0.12, d + 0.15),
    new THREE.MeshLambertMaterial({ color: randomFrom(ROOF_COLORS) })
  );
  roof.position.y = h + 0.06;
  roof.castShadow = true;
  g.add(roof);

  // Parapet wall on roof (low border, common in Indian buildings)
  const parapet = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.1, 0.2, d + 0.1),
    new THREE.MeshLambertMaterial({ color: wallColor })
  );
  parapet.position.y = h + 0.18;

  g.add(parapet);

  // Windows grid (facing the road)
  const faceZ = (side > 0 ? -1 : 1) * (d / 2 + 0.01);
  const windowMat = new THREE.MeshLambertMaterial({ color: 0x6b8cae });
  const litWindowMat = new THREE.MeshLambertMaterial({ color: 0xfacc15, emissive: 0xfbbf24, emissiveIntensity: 0.25 });
  const cols = Math.max(2, Math.floor(w / 0.6));
  for (let f = 0; f < floors; f++) {
    for (let c = 0; c < cols; c++) {
      const isLit = Math.random() > 0.6;
      const win = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.4, 0.04),

      );
      const wx = -w / 2 + (c + 0.5) * (w / cols);
      win.position.set(wx, 0.5 + f * floorH, faceZ);
      g.add(win);
      // Window frame
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(0.36, 0.46, 0.03),

      );
      frame.position.set(wx, 0.5 + f * floorH, faceZ - (side > 0 ? 0.01 : -0.01));
      g.add(frame);
    }
  }

  // Door at ground level
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.6, 0.05),
    new THREE.MeshLambertMaterial({ color: 0x4a3520 })
  );
  door.position.set(0, 0.3, faceZ);
  g.add(door);

  // Ground-floor shop awning (colorful — very Indian street look)
  if (Math.random() > 0.4) {
    const awningColors = [0xdc2626, 0x16a34a, 0x2563eb, 0xea580c, 0xca8a04];
    const awning = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.9, 0.06, 0.5),
      new THREE.MeshLambertMaterial({ color: randomFrom(awningColors) })
    );
    awning.position.set(0, 0.7, faceZ + (side > 0 ? -0.25 : 0.25));
    awning.rotation.x = side > 0 ? 0.3 : -0.3;
    g.add(awning);
  }

  // Rooftop water tank (ubiquitous on Indian buildings)
  if (Math.random() > 0.5) {
    const tank = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 0.3, 12),
      new THREE.MeshLambertMaterial({ color: 0x1e3a8a })

    tank.position.set(w / 4, h + 0.35, d / 4);

    stand.position.set(w / 4, h + 0.22, d / 4);
    g.add(stand);
    g.add(tank);

  g.position.set(x, 0, z);
  // Face the road
  g.rotation.y = (side > 0 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.1;
  scene.add(g);

function makeMilestoneStone(x, cityName, kmText) {
  const g = new THREE.Group();

  // A flattened sphere sitting on the body reads as a proper milestone cap from all angles
  const domeGeo = new THREE.SphereGeometry(0.36, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  const dome = new THREE.Mesh(domeGeo, yellowMat);

    yellowMat
  );
  band.position.set(0, 0.86, 0);
  g.add(band);

  // ---- Text panels on the faces (canvas textures) ----
  function makeStoneText(w, h, lines) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 256, 256);
    ctx.fillStyle = '#1a1a1a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let fs = 52;
    ctx.font = `bold ${fs}px Arial, sans-serif`;
    while (ctx.measureText(lines[0]).width > 220 && fs > 20) {
      fs -= 2; ctx.font = `bold ${fs}px Arial, sans-serif`;
    }
    ctx.fillText(lines[0], 128, lines[1] ? 120 : 128);
    if (lines[1]) {
      ctx.font = 'bold 36px Arial, sans-serif';
      ctx.fillStyle = '#c0392b';
      ctx.fillText(lines[1], 128, 185);
    }
    const t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
    t.anisotropy = 8;
    return t;
  }

  // City name + km marker on the WHITE body front (black text)
  const bodyTex = makeStoneText(0.66, 0.5, [cityName, kmText]);
  const bodyFace = new THREE.Mesh(
    new THREE.PlaneGeometry(0.62, 0.62),
    new THREE.MeshLambertMaterial({ map: bodyTex, transparent: true })
  );
  bodyFace.position.set(0, 0.5, 0.215);
  g.add(bodyFace);

  // Same text on the BACK of the body too (readable from both directions)
  const backFace = new THREE.Mesh(
    new THREE.PlaneGeometry(0.62, 0.62),
    new THREE.MeshLambertMaterial({ map: bodyTex, transparent: true })
  );
  backFace.position.set(0, 0.5, -0.215);
  backFace.rotation.y = Math.PI;
  g.add(backFace);

  // ---- Small base in the ground ----
  const stoneBase = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.12, 0.5),
    new THREE.MeshLambertMaterial({ color: 0xcfcfc8 })
  );
  stoneBase.position.set(0, 0.06, 0);
  g.add(stoneBase);

  // Place beside the road on the right, facing the oncoming rider
  g.position.set(x, 0, 2.8);
  g.rotation.y = -Math.PI / 2 - 0.25;
  scene.add(g);
}

// THE VEHICLE — realistic 3D car model (loaded from car.glb)
// ====================================================
const bike = new THREE.Group();  // kept name "bike" so all journey logic still works

// Load the realistic car GLB model into the group
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.load(
  'car.glb',
  (gltf) => {
    const model = gltf.scene;

    // --- Auto-scale & center the model to fit the scene ---
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);

    // Target car length ~3.4 units in the scene (cars look right a bit larger than a bike).
    // The model's longest axis is its length.
    const longest = Math.max(size.x, size.y, size.z);
    const scaleFactor = 3.4 / longest;
    model.scale.setScalar(scaleFactor);

    // Recenter so the model sits on the ground, centered on the group origin
    model.position.x = -center.x * scaleFactor;
    model.position.z = -center.z * scaleFactor;
    model.position.y = -box.min.y * scaleFactor; // bottom rests at y=0

    // Enable shadows on all meshes
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // The car's length runs along X. The journey rotates the whole `bike` group
    // to face the travel direction, so we orient the model here to point forward.
    // (If the car faces the wrong way after loading, change this angle.)
    model.rotation.y = -Math.PI / 2;

    bike.add(model);
    window._bikeModelLoaded = true;
  },
  undefined,
  (err) => {
    console.error('Error loading car.glb:', err);
    // Fallback: a simple placeholder so the journey still works
    const fallback = new THREE.Mesh(
      new THREE.BoxGeometry(2.5, 0.8, 1.2),
      new THREE.MeshLambertMaterial({ color: 0x2563eb })
    );
    fallback.position.y = 0.6;
    fallback.castShadow = true;
    bike.add(fallback);
  }
);

let targetT = 0;
const cameraOffset = new THREE.Vector3(-4, 3.2, 4.5);

// Camera modes: 'follow' (normal chase camera) or 'orbit' (360° around bike when clicked)
let cameraMode = 'follow';
let orbitAngle = 0;
let orbitSpeed = 0.006;
let orbitRadius = 3.5;
let orbitHeight = 1.8;
let autoOrbitAngle = 0; // for gentle auto-rotation when stopped at a milestone

function updateBikePosition(delta) {
  // Ease toward target
  const lerpSpeed = 0.04;
  currentT += (targetT - currentT) * lerpSpeed;
  currentT = Math.max(0, Math.min(1, currentT));

  const pos = curve.getPointAt(currentT);
  bike.position.set(pos.x, 0, pos.z);

  // Orient bike along tangent
  const tangent = curve.getTangentAt(currentT).normalize();
  const angle = Math.atan2(tangent.x, tangent.z);
  bike.rotation.y = angle - Math.PI / 2;

  // Is the bike basically stopped (arrived at a milestone)?
  const distToTarget = Math.abs(targetT - currentT);
  const isStopped = distToTarget < 0.002;

  // (Wheel-spin removed — handled by the GLB model as one piece)

  // ===== CAMERA: manual orbit mode (when user clicks bike) =====
  if (cameraMode === 'orbit') {
    orbitAngle += orbitSpeed;
    const camX = pos.x + Math.cos(orbitAngle) * orbitRadius;
    const camZ = pos.z + Math.sin(orbitAngle) * orbitRadius;
    const targetCamPos = new THREE.Vector3(camX, pos.y + orbitHeight, camZ);
    camera.position.lerp(targetCamPos, 0.08);
    camera.lookAt(pos.x, 1.2, pos.z);
    return;
  }

  // ===== CAMERA: auto-rotate gently when STOPPED at a milestone =====
  if (isStopped) {
    autoOrbitAngle += 0.0025; // slow, cinematic rotation
    const r = 6.5;
    const camX = pos.x + Math.cos(autoOrbitAngle) * r;
    const camZ = pos.z + Math.sin(autoOrbitAngle) * r;
    const targetCamPos = new THREE.Vector3(camX, pos.y + 3.2, camZ);
    camera.position.lerp(targetCamPos, 0.04);
    camera.lookAt(pos.x, 1.3, pos.z);
    return;
  }

  // ===== CAMERA: smooth chase while RIDING (no mouse jitter) =====
  const tangentDir = curve.getTangentAt(currentT).normalize();
  const behind = tangentDir.clone().multiplyScalar(-7);
  const sideways = new THREE.Vector3().crossVectors(tangentDir, new THREE.Vector3(0, 1, 0)).normalize();
  const targetCamPos = new THREE.Vector3(
    pos.x + behind.x + sideways.x * 1.5,
    pos.y + 4.5,
    pos.z + behind.z + sideways.z * 1.5
  );
  camera.position.lerp(targetCamPos, 0.06);

  const lookAhead = curve.getPointAt(Math.min(currentT + 0.04, 1));
  camera.lookAt(lookAhead.x, 1.5, lookAhead.z);

  // Sync auto-orbit angle to current camera position so the transition into
  // auto-rotate (when we arrive) is seamless
  autoOrbitAngle = Math.atan2(camera.position.z - pos.z, camera.position.x - pos.x);
}

// ====================================================
// RIDE TO MILESTONE
// ====================================================
let activeMilestone = -1;

function rideTo(index) {
  targetT = milestoneT[index];
  activeMilestone = index;

  // If currently in 360° orbit view, return to follow mode so user sees the journey
  if (cameraMode === 'orbit') {
    setOrbitMode(false);
  }

  // Update button states
  document.querySelectorAll('.milestone-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  // Hide info panel during transition
  const panel = document.getElementById('infoPanel');
  panel.classList.remove('visible');

  // Pulse the destination ring
  milestoneObjects.forEach((m, i) => {
    m.ring.material.opacity = 0;
  });

  // Show info after arrival
  clearTimeout(window._arriveTimer);
  window._arriveTimer = setTimeout(() => {
    showInfo(index);
    milestoneObjects[index].ring.material.opacity = 0.6;
  }, 1400);
}

function showInfo(index) {
  const m = MILESTONES[index];
  document.getElementById('infoMeta').textContent = m.meta;
  document.getElementById('infoTitle').textContent = m.name;
  document.getElementById('infoRole').textContent = m.role;
  document.getElementById('infoBody').textContent = m.body;
  const tagsEl = document.getElementById('infoTags');
  tagsEl.innerHTML = '';
  m.tags.forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'info-tag';
    tag.textContent = t;
    tagsEl.appendChild(tag);
  });
  document.getElementById('infoPanel').classList.add('visible');
}

// ====================================================
// ANIMATE
// ====================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.elapsedTime;

  // Smooth mouse follow (used by camera parallax inside updateBikePosition)
  mouse.x += (mouse.targetX - mouse.x) * 0.05;
  mouse.y += (mouse.targetY - mouse.y) * 0.05;

  updateBikePosition(delta);

  // (Rider animation removed — bike rides on its own)

  // Animate clouds — slow horizontal drift, wrap around
  clouds.forEach(cloud => {
    cloud.position.x += cloud.userData.driftSpeed;
    if (cloud.position.x > 60) cloud.position.x = -40;
  });

  // Animate birds — figure-8 flight + wing flap
  birds.forEach(bird => {
    const u = bird.userData;
    bird.position.x += u.speed;
    bird.position.y = u.flightY + Math.sin(time * 1.5 + u.wingPhase) * 0.5;
    bird.position.z = u.flightZ + Math.cos(time * 0.8 + u.wingPhase) * 2;
    if (bird.position.x > 50) bird.position.x = -50;
    // Wing flap
    const flap = Math.sin(time * 12 + u.wingPhase) * 0.5;
    u.wingL.rotation.z = flap;
    u.wingR.rotation.z = -flap;
  });

  // Animate floating geometric shapes
  floaters.forEach(f => {
    f.rotation.x += f.userData.rotSpeed;
    f.rotation.y += f.userData.rotSpeed * 0.7;
    f.position.y = f.userData.baseY + Math.sin(time * f.userData.bobSpeed * 50) * f.userData.bobAmp;
  });

  // Animate sun rays in the sunrise ending
  techAnimated.forEach(item => {
    if (item.type === 'sunrays') {
      item.mesh.rotation.z += item.userData.spin;
    }
  });

  // Animate active milestone ring (pulse)
  if (activeMilestone >= 0) {
    const ring = milestoneObjects[activeMilestone].ring;
    ring.scale.setScalar(1 + Math.sin(time * 3) * 0.15);
  }

  renderer.render(scene, camera);
}

// Initial camera position
camera.position.set(-6, 5, 6);
camera.lookAt(2, 0.5, 0);

// ====================================================
// RESIZE
// ====================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ====================================================
// CLICK BIKE → 360° ORBIT VIEW
// ====================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setOrbitMode(on) {
  cameraMode = on ? 'orbit' : 'follow';
  if (on) {
    orbitAngle = 0;
    showOrbitHint();
  } else {
    hideOrbitHint();
  }
  if (window.__refreshOrbitBtn) window.__refreshOrbitBtn();
}

// Show a small banner when in orbit mode telling user how to exit
function showOrbitHint() {
  let el = document.getElementById('orbitHint');
  if (!el) {
    el = document.createElement('div');
    el.id = 'orbitHint';
    el.style.cssText = `
      position: fixed; top: 7rem; left: 50%; transform: translateX(-50%);
      background: rgba(30, 58, 138, 0.95); color: white; padding: 0.7rem 1.4rem;
      border-radius: 100px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      letter-spacing: 0.1em; text-transform: uppercase; z-index: 20;
      box-shadow: 0 8px 24px rgba(30, 58, 138, 0.35); font-weight: 600;
      backdrop-filter: blur(8px); cursor: pointer;
    `;
    el.textContent = '◉ 360° view — click anywhere to exit';
    el.addEventListener('click', () => setOrbitMode(false));
    document.body.appendChild(el);
  }
  el.style.display = 'block';
}

function hideOrbitHint() {
  const el = document.getElementById('orbitHint');
  if (el) el.style.display = 'none';
}

function handleCanvasClick(clientX, clientY) {
  // Convert to normalized device coordinates
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  // Check if user clicked on the bike (recursive: matches any child mesh of the bike group)
  const hits = raycaster.intersectObject(bike, true);

  if (hits.length > 0 && cameraMode === 'follow') {
    // Clicked the bike → enter orbit mode
    setOrbitMode(true);
  } else if (cameraMode === 'orbit') {
    // Clicked elsewhere (or anywhere when in orbit mode) → exit orbit
    setOrbitMode(false);
  }
}

// Hover detection — change cursor to pointer when over the bike
canvas.addEventListener('mousemove', (e) => {
  if (cameraMode === 'orbit') {
    canvas.style.cursor = 'pointer';
    return;
  }
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(bike, true);
  canvas.style.cursor = hits.length > 0 ? 'pointer' : 'default';
});

// Click handler — but ignore clicks that originate from UI elements
canvas.addEventListener('click', (e) => {
  // Only respond to clicks on the canvas itself
  if (e.target === canvas) {
    handleCanvasClick(e.clientX, e.clientY);
  }
});

// Touch handler for mobile (tap to orbit / tap to exit)
canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0 && e.changedTouches.length > 0) {
    const t = e.changedTouches[0];
    handleCanvasClick(t.clientX, t.clientY);
  }
}, { passive: true });

// ESC key exits orbit mode
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && cameraMode === 'orbit') {
    setOrbitMode(false);
  }
});

// 360° View button — guaranteed-working toggle (in case raycaster has issues)
const orbitToggleBtn = document.getElementById('orbitToggleBtn');
if (orbitToggleBtn) {
  orbitToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setOrbitMode(cameraMode !== 'orbit');
    orbitToggleBtn.textContent = cameraMode === 'orbit' ? '✕ Exit 360° View' : '◉ 360° View';
  });
  // Update button label when orbit mode changes from other sources
  const _origSetOrbit = setOrbitMode;
  window.__refreshOrbitBtn = () => {
    orbitToggleBtn.textContent = cameraMode === 'orbit' ? '✕ Exit 360° View' : '◉ 360° View';
  };
}

// ====================================================
// START
// ====================================================
animate();

// Hide loader after a brief moment (everything's loaded by now)
setTimeout(() => {
  document.getElementById('loader').classList.add('hidden');
}, 800);

// Auto-ride to first milestone after a short pause for impact
setTimeout(() => {
  rideTo(0);
}, 1600);

</script>
</body>
