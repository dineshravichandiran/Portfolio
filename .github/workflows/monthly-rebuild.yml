name: Monthly rebuild

# The years-of-experience figure in the page's meta description is filled in at
# build time. A rebuild once a month keeps it in step with the calendar; the
# visible text on the page already updates itself in the browser.
on:
  schedule:
    - cron: '0 6 6 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push an empty commit to trigger a deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Monthly rebuild to refresh the experience figure in page meta"
          git push
