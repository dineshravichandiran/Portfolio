<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e8ca3"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35c46b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5484d"/></marker>
  </defs>
  <rect width="980" height="440" fill="#0b1220"/>

  <!-- chaos -->
  <rect x="24" y="44" width="200" height="64" rx="8" fill="#121b2e" stroke="#e5484d"/>
  <text x="124" y="70" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">Chaos scripts</text>
  <text x="124" y="90" fill="#aebbd0" font-size="11" text-anchor="middle">break the app on purpose</text>
  <line x1="224" y1="76" x2="296" y2="76" stroke="#e5484d" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="260" y="66" fill="#7e8ca3" font-size="10" text-anchor="middle">set env</text>

  <!-- cluster -->
  <rect x="298" y="20" width="650" height="270" rx="12" fill="none" stroke="#2d4165" stroke-dasharray="5 5"/>
  <text x="314" y="42" fill="#7e8ca3" font-size="11" letter-spacing="1" font-weight="700">KIND CLUSTER · namespace self-healing-lab</text>

  <rect x="316" y="58" width="230" height="86" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="431" y="84" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">flaky-service Deployment</text>
  <text x="431" y="104" fill="#aebbd0" font-size="11" text-anchor="middle">CRASH_AFTER_SECONDS</text>
  <text x="431" y="120" fill="#aebbd0" font-size="11" text-anchor="middle">LEAK_MB_PER_SEC · 64Mi limit</text>
  <line x1="546" y1="101" x2="610" y2="101" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="578" y="92" fill="#7e8ca3" font-size="10" text-anchor="middle">fails</text>

  <rect x="612" y="58" width="150" height="86" rx="8" fill="#121b2e" stroke="#e4a93b"/>
  <text x="687" y="84" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">kubelet</text>
  <text x="687" y="104" fill="#aebbd0" font-size="11" text-anchor="middle">CrashLoopBackOff</text>
  <text x="687" y="120" fill="#aebbd0" font-size="11" text-anchor="middle">OOMKilled</text>
  <line x1="762" y1="101" x2="806" y2="101" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="784" y="92" fill="#7e8ca3" font-size="10" text-anchor="middle">watch</text>

  <rect x="808" y="58" width="124" height="86" rx="8" fill="#142238" stroke="#3e8ede"/>
  <text x="870" y="84" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">healer.py</text>
  <text x="870" y="104" fill="#aebbd0" font-size="11" text-anchor="middle">pod watch via</text>
  <text x="870" y="120" fill="#aebbd0" font-size="11" text-anchor="middle">Kubernetes API</text>

  <!-- decisions -->
  <line x1="870" y1="144" x2="870" y2="176" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="640" y="178" width="292" height="40" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="786" y="203" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">30s per-pod cooldown (skip if recent)</text>
  <line x1="786" y1="218" x2="786" y2="234" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="560" y="236" width="372" height="42" rx="8" fill="#0f1830" stroke="#35c46b"/>
  <text x="746" y="253" fill="#dce4ee" font-size="12" font-weight="700" text-anchor="middle">JSON patch: clear bad env on the Deployment</text>
  <text x="746" y="269" fill="#aebbd0" font-size="10.5" text-anchor="middle">Deployment controller reschedules a healthy pod</text>
  <path d="M560 257 H 531 V 146" stroke="#35c46b" stroke-width="1.6" fill="none" marker-end="url(#g)"/>

  <rect x="316" y="196" width="190" height="80" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="411" y="220" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">RBAC (namespace Role)</text>
  <text x="411" y="240" fill="#aebbd0" font-size="11" text-anchor="middle">pods: get, list, watch</text>
  <text x="411" y="256" fill="#aebbd0" font-size="11" text-anchor="middle">deployments: + patch</text>

  <!-- log -->
  <rect x="24" y="320" width="924" height="90" rx="10" fill="#0f1830" stroke="#35c46b" stroke-dasharray="5 5"/>
  <text x="44" y="346" fill="#35c46b" font-size="12" letter-spacing="1" font-weight="700">AUDIT TRAIL</text>
  <text x="44" y="370" fill="#aebbd0" font-size="12.5">Every detection and remediation is written to self_healing.log with a timestamp.</text>
  <text x="44" y="388" fill="#aebbd0" font-size="12.5">The chaos scripts poll for the real failure state before declaring success, so the test cannot pass on a failure that never happened.</text>
  <line x1="746" y1="278" x2="746" y2="318" stroke="#35c46b" stroke-width="1.6" marker-end="url(#g)" stroke-dasharray="4 3"/>
</svg>
