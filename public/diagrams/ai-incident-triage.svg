<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e8ca3"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35c46b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5484d"/></marker>
  </defs>
  <rect width="980" height="520" fill="#0b1220"/>

  <rect x="24" y="44" width="150" height="78" rx="8" fill="#121b2e" stroke="#e4a93b"/>
  <text x="99" y="76" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">Alert fires</text>
  <text x="99" y="97" fill="#aebbd0" font-size="11" text-anchor="middle">metric + service</text>
  <line x1="174" y1="83" x2="212" y2="83" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="214" y="44" width="210" height="78" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="319" y="70" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">Context filter</text>
  <text x="319" y="89" fill="#aebbd0" font-size="11" text-anchor="middle">alerting service · last 10 min</text>
  <text x="319" y="105" fill="#aebbd0" font-size="11" text-anchor="middle">WARN and up · repeats collapsed</text>
  <line x1="424" y1="83" x2="470" y2="83" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="472" y="44" width="210" height="78" rx="8" fill="#142238" stroke="#3e8ede"/>
  <text x="577" y="70" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">Model: one decision</text>
  <text x="577" y="89" fill="#aebbd0" font-size="11" text-anchor="middle">cause category + quoted evidence</text>
  <text x="577" y="105" fill="#aebbd0" font-size="11" text-anchor="middle">+ confidence</text>
  <line x1="682" y1="83" x2="740" y2="83" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="711" y="74" fill="#7e8ca3" font-size="10" text-anchor="middle">explains</text>

  <rect x="742" y="44" width="210" height="78" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="847" y="70" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">Runbook retrieval</text>
  <text x="847" y="89" fill="#aebbd0" font-size="11" text-anchor="middle">metadata filter, then BM25</text>
  <text x="847" y="105" fill="#aebbd0" font-size="11" text-anchor="middle">one chunk per runbook step</text>

  <line x1="577" y1="122" x2="577" y2="190" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M847 122 V 220 H 682" stroke="#7e8ca3" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="472" y="192" width="210" height="56" rx="8" fill="#121b2e" stroke="#e4a93b"/>
  <text x="577" y="216" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">Cause = runbook?</text>
  <text x="577" y="234" fill="#aebbd0" font-size="11" text-anchor="middle">two separate routes must agree</text>

  <line x1="472" y1="220" x2="424" y2="220" stroke="#e5484d" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="448" y="212" fill="#e5484d" font-size="10" text-anchor="middle">no</text>
  <rect x="214" y="192" width="210" height="56" rx="8" fill="#121b2e" stroke="#e5484d"/>
  <text x="319" y="216" fill="#dce4ee" font-size="13.5" font-weight="700" text-anchor="middle">Escalate to a human</text>
  <text x="319" y="234" fill="#aebbd0" font-size="11" text-anchor="middle">no action taken</text>

  <line x1="577" y1="248" x2="577" y2="300" stroke="#35c46b" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="592" y="278" fill="#35c46b" font-size="10">yes</text>
  <rect x="472" y="302" width="210" height="52" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="577" y="325" fill="#dce4ee" font-size="13" font-weight="700" text-anchor="middle">Dry run: the runbook's check</text>
  <text x="577" y="342" fill="#aebbd0" font-size="11" text-anchor="middle">nothing changes yet</text>
  <path d="M472 328 H 319 V 248" stroke="#e5484d" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="396" y="320" fill="#e5484d" font-size="10" text-anchor="middle">problem not confirmed</text>

  <line x1="682" y1="328" x2="740" y2="328" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="742" y="302" width="210" height="52" rx="8" fill="#142238" stroke="#3e8ede"/>
  <text x="847" y="325" fill="#dce4ee" font-size="13" font-weight="700" text-anchor="middle">A person approves?</text>
  <text x="847" y="342" fill="#aebbd0" font-size="11" text-anchor="middle">single-use id, checked in code</text>

  <line x1="847" y1="354" x2="847" y2="396" stroke="#35c46b" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="862" y="380" fill="#35c46b" font-size="10">yes</text>
  <rect x="742" y="398" width="210" height="46" rx="8" fill="#0f1830" stroke="#35c46b"/>
  <text x="847" y="418" fill="#dce4ee" font-size="13" font-weight="700" text-anchor="middle">Fix, then check again</text>
  <text x="847" y="434" fill="#aebbd0" font-size="11" text-anchor="middle">verify before calling it fixed</text>

  <rect x="24" y="468" width="928" height="40" rx="10" fill="#0f1830" stroke="#35c46b" stroke-dasharray="5 5"/>
  <text x="44" y="486" fill="#35c46b" font-size="11" letter-spacing="1" font-weight="700">AUDIT TRAIL</text>
  <text x="150" y="486" fill="#aebbd0" font-size="12">Every step is written to a JSON log. The incident note is written by code, not the model, so it holds no invented facts.</text>
  <text x="44" y="502" fill="#7e8ca3" font-size="11">Synthetic lab: fixes change a simulated state, never a real machine.</text>
</svg>
