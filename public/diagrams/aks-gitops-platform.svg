  <text x="385" y="373" fill="#aebbd0" font-size="10.5" text-anchor="middle">to Jaeger via a collector</text>

  <rect x="536" y="292" width="200" height="112" rx="8" fill="#121b2e" stroke="#e4a93b"/>
