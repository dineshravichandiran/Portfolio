  <text x="860" y="357" fill="#aebbd0" font-size="10.5" text-anchor="middle">Git as JSON, loaded by</text>
  <text x="860" y="373" fill="#aebbd0" font-size="10.5" text-anchor="middle">the sidecar</text>

