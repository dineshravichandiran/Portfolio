  <text x="705" y="87" fill="#aebbd0" font-size="11" text-anchor="middle">Helm chart + tag</text>
  <line x1="556" y1="161" x2="660" y2="106" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>

