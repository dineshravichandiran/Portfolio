  <text x="311" y="86" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">pytest</text>
  <rect x="406" y="58" width="150" height="46" rx="8" fill="#142238" stroke="#3e8ede"/>
  <text x="481" y="86" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">build image</text>
