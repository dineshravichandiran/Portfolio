  <text x="636" y="340" fill="#aebbd0" font-size="10.5" text-anchor="middle">99% SLO, error budget</text>
  <text x="636" y="357" fill="#aebbd0" font-size="10.5" text-anchor="middle">DemoAppHighErrorRate</text>
  <text x="636" y="373" fill="#aebbd0" font-size="10.5" text-anchor="middle">DemoAppFastBurn</text>

  <rect x="782" y="292" width="156" height="112" rx="8" fill="#142238" stroke="#35c46b"/>
  <text x="860" y="318" fill="#dce4ee" font-size="13" font-weight="700" text-anchor="middle">Grafana</text>
