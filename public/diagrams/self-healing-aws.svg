<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7e8ca3"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35c46b"/></marker>
  </defs>
  <rect width="980" height="500" fill="#0b1220"/>
  <text x="24" y="34" fill="#7e8ca3" font-size="12" letter-spacing="1.4" font-weight="700">TRAFFIC PATH</text>
  <text x="520" y="34" fill="#7e8ca3" font-size="12" letter-spacing="1.4" font-weight="700">HEALING PATHS</text>

  <!-- traffic path -->
  <rect x="24" y="52" width="110" height="46" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="79" y="80" fill="#dce4ee" font-size="14" font-weight="700" text-anchor="middle">Users</text>
  <line x1="134" y1="75" x2="176" y2="75" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="178" y="52" width="150" height="46" rx="8" fill="#142238" stroke="#3e8ede"/>
  <text x="253" y="73" fill="#dce4ee" font-size="14" font-weight="700" text-anchor="middle">Application LB</text>
  <text x="253" y="90" fill="#aebbd0" font-size="11" text-anchor="middle">HTTP health checks</text>
  <line x1="253" y1="98" x2="253" y2="140" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="24" y="124" width="440" height="244" rx="12" fill="none" stroke="#2d4165" stroke-dasharray="5 5"/>
  <text x="38" y="146" fill="#7e8ca3" font-size="11" letter-spacing="1" font-weight="700">VPC 10.20.0.0/16 · 2 public subnets, 1 per AZ</text>
  <rect x="44" y="160" width="400" height="190" rx="10" fill="#0f1830" stroke="#3e8ede"/>
  <text x="58" y="182" fill="#3e8ede" font-size="12" font-weight="700">Auto Scaling Group · min 2, max 6, CPU target 60%</text>
  <rect x="62" y="200" width="170" height="64" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="147" y="228" fill="#dce4ee" font-size="13" font-weight="700" text-anchor="middle">EC2 · subnet A</text>
  <text x="147" y="246" fill="#aebbd0" font-size="11" text-anchor="middle">t3.micro, web server</text>
  <rect x="254" y="200" width="170" height="64" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="339" y="228" fill="#dce4ee" font-size="13" font-weight="700" text-anchor="middle">EC2 · subnet B</text>
  <text x="339" y="246" fill="#aebbd0" font-size="11" text-anchor="middle">t3.micro, web server</text>
  <text x="244" y="298" fill="#aebbd0" font-size="12" text-anchor="middle">Native: ELB health check failure →</text>
  <text x="244" y="316" fill="#aebbd0" font-size="12" text-anchor="middle">ASG terminates and replaces the instance</text>
  <text x="244" y="338" fill="#7e8ca3" font-size="11" text-anchor="middle">health_check_grace_period 60s</text>

  <!-- healing path 1 -->
  <rect x="520" y="52" width="210" height="50" rx="8" fill="#121b2e" stroke="#e4a93b"/>
  <text x="625" y="73" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">Alarm: StatusCheckFailed_System</text>
  <text x="625" y="90" fill="#aebbd0" font-size="11" text-anchor="middle">hardware / hypervisor fault</text>
  <line x1="730" y1="77" x2="772" y2="77" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="774" y="52" width="186" height="50" rx="8" fill="#142238" stroke="#3e8ede"/>
  <text x="867" y="73" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">EC2 auto-recover</text>
  <text x="867" y="90" fill="#aebbd0" font-size="11" text-anchor="middle">native AWS action</text>

  <!-- healing path 2 -->
  <rect x="520" y="140" width="210" height="50" rx="8" fill="#121b2e" stroke="#e4a93b"/>
  <text x="625" y="161" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">Alarm: UnHealthyHostCount ≥ 1</text>
  <text x="625" y="178" fill="#aebbd0" font-size="11" text-anchor="middle">ALB target health</text>
  <line x1="730" y1="165" x2="772" y2="165" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="774" y="140" width="186" height="50" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="867" y="161" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">SNS topic</text>
  <text x="867" y="178" fill="#aebbd0" font-size="11" text-anchor="middle">fans out to two targets</text>
  <line x1="867" y1="190" x2="867" y2="214" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="774" y="216" width="186" height="64" rx="8" fill="#142238" stroke="#35c46b"/>
  <text x="867" y="238" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">Lambda: remediate</text>
  <text x="867" y="255" fill="#aebbd0" font-size="11" text-anchor="middle">marks instance Unhealthy,</text>
  <text x="867" y="270" fill="#aebbd0" font-size="11" text-anchor="middle">ASG replaces it</text>
  <path d="M800 190 V 204 H 580 V 220" stroke="#7e8ca3" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="520" y="222" width="120" height="52" rx="8" fill="#121b2e" stroke="#2d4165"/>
  <text x="580" y="244" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">Email</text>
  <text x="580" y="261" fill="#aebbd0" font-size="11" text-anchor="middle">ops on-call</text>
  <text x="690" y="218" fill="#7e8ca3" font-size="10" text-anchor="middle">email subscription</text>

  <!-- healing path 3 -->
  <rect x="520" y="306" width="210" height="50" rx="8" fill="#121b2e" stroke="#e4a93b"/>
  <text x="625" y="327" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">EventBridge: instance stopped</text>
  <text x="625" y="344" fill="#aebbd0" font-size="11" text-anchor="middle">OOM kill or human error</text>
  <line x1="730" y1="331" x2="772" y2="331" stroke="#7e8ca3" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="774" y="298" width="186" height="66" rx="8" fill="#142238" stroke="#35c46b"/>
  <text x="867" y="320" fill="#dce4ee" font-size="12.5" font-weight="700" text-anchor="middle">Lambda: restart</text>
  <text x="867" y="337" fill="#aebbd0" font-size="11" text-anchor="middle">only if tagged</text>
  <text x="867" y="352" fill="#aebbd0" font-size="11" text-anchor="middle">SelfHealing=true</text>

  <!-- observability -->
  <rect x="24" y="408" width="936" height="70" rx="10" fill="#0f1830" stroke="#35c46b" stroke-dasharray="5 5"/>
  <text x="44" y="432" fill="#35c46b" font-size="12" letter-spacing="1" font-weight="700">EVERY REMEDIATION IS OBSERVABLE</text>
  <text x="44" y="454" fill="#aebbd0" font-size="12.5">Both Lambdas publish SelfHealingInfra / RemediationActionsTaken before returning, shown on a CloudWatch dashboard,</text>
  <text x="44" y="470" fill="#aebbd0" font-size="12.5">so "did healing actually happen" is answered by a metric, not guessed from logs.</text>
  <line x1="867" y1="364" x2="867" y2="406" stroke="#35c46b" stroke-width="1.6" marker-end="url(#g)"/>
</svg>
